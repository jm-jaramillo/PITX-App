<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modules · PITX Terminal Ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared/styles.css" />
    <style>
      .portal { max-width: 880px; margin: 0 auto; padding: 48px 16px; }
      .portal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 32px; }
      .portal-head img { height: 40px; }
      .portal-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      .portal-card { display: block; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); text-decoration: none; color: inherit; }
      .portal-card:hover { border-color: var(--blue); }
      .portal-card h2 { margin: 0 0 6px; font-size: 18px; color: var(--title); }
      .portal-card p { margin: 0; font-size: 14px; color: var(--label); }
    </style>
  </head>
  <body>
    <main class="portal">
      <div class="portal-head">
        <img src="shared/pitx-logo.webp" alt="PITX" />
        <button type="button" class="btn-outline" id="sign-out">Sign out</button>
      </div>
      <h1>Terminal Ops</h1>
      <p class="subtle">Choose a module.</p>
      <div class="portal-grid" id="modules"></div>
    </main>

    <script type="module">
      import { getProfile, signOut, escapeHtml } from "./shared/platform.js";
      import { modulesFor, moduleHome } from "./shared/modules.js";

      document.getElementById("sign-out").addEventListener("click", signOut);

      const profile = await getProfile();
      if (!profile) {
        location.replace("index.html");
      } else {
        const mods = modulesFor(profile.role);
        document.getElementById("modules").innerHTML = mods
          .map(
            (m) => `<a class="portal-card" href="${m.path}${moduleHome(m, profile.role)}">
              <h2>${escapeHtml(m.name)}</h2><p>${escapeHtml(m.description)}</p></a>`
          )
          .join("");
      }
    </script>
  </body>
</html>
