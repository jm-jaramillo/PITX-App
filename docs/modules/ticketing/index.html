<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PITX Ticketing and Booking</title>
    <!-- The module folder URL lands here. Until the Supabase pages are built, the home page is the
         demo: the prototype on sample data kept in the browser (docs/modules/ticketing/PLAN.md).
         The portal sign-in is the only sign-in: this page hands the user's name to the demo, which
         has no sign-in form of its own on the site (prototype/src/lib/portal.ts). -->
  </head>
  <body>
    <p>Opening Ticketing and Booking…</p>
    <script type="module">
      import { getProfile } from "../../shared/platform.js";

      const profile = await getProfile();
      if (!profile) {
        location.replace("../../login.html");
      } else if (!["staff", "ticketing", "operator"].includes(profile.role)) {
        location.replace("../../index.html");
      } else {
        // Operators (e.g. genesis-ops) open it as their bus company only.
        localStorage.setItem(
          "pitx-ticketing-portal-user",
          JSON.stringify({
            name: profile.operator_name || profile.username,
            role: profile.role,
            operatorId: profile.role === "operator" ? profile.id : undefined,
          })
        );
        location.replace("demo/");
      }
    </script>
  </body>
</html>
