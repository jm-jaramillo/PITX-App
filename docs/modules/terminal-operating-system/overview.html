<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview · PITX Terminal Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <link rel="stylesheet" href="assets/tos.css?v=20261111-1" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="nav"></aside>
      <div class="app-content">
        <main class="wrap">
          <div class="page-head">
            <div>
              <p class="eyebrow" id="eyebrow">Terminal Operations &middot; Today</p>
              <h1>Overview</h1>
              <p class="subtle" id="sub">On-time and late arrivals and departures for today, so far.</p>
            </div>
            <div class="tos-head-right">
              <span id="live"></span>
              <button type="button" class="btn-outline" data-act="refresh">Refresh</button>
            </div>
          </div>

          <div class="toolbar" style="margin-bottom: 14px; flex-wrap: wrap; gap: 10px; align-items: center">
            <div class="tos-seg" role="group" aria-label="Period" id="mode"></div>
            <div class="tos-actions" id="pick" style="align-items: center"></div>
            <label class="subtle hidden" id="tests-wrap" style="display: inline-flex; gap: 6px; align-items: center">
              <input type="checkbox" id="tests" /> Include test reads
            </label>
          </div>

          <div class="hidden" id="message"></div>
          <p class="subtle hidden" id="note" style="margin: 0 0 12px"></p>
          <div class="kpis" id="kpis"></div>
          <div class="tos-split" style="grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)">
            <section class="table-wrap">
              <div class="tos-panel-head">
                <h3 id="arr-title">Arrivals per hour</h3>
                <div class="tos-leg"><span style="--c: var(--blue)">On time</span><span style="--c: var(--red-ink)">Late</span></div>
              </div>
              <div class="tos-chart" id="arr-chart" style="padding: 14px 16px"></div>
            </section>
            <section class="table-wrap">
              <div class="tos-panel-head">
                <h3 id="dep-title">Departures per hour</h3>
                <div class="tos-leg"><span style="--c: var(--blue)">On time</span><span style="--c: var(--red-ink)">Late</span></div>
              </div>
              <div class="tos-chart" id="dep-chart" style="padding: 14px 16px"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script type="module">
      import { guardPage, renderNav, showMessage, liveText, supabase, manilaToday } from "./assets/tos.js?v=20261111-1";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      /* ---- period: Today (refreshes every 20 s), one Day, or one Month. Kept in the link. */
      const today = manilaToday();
      const q = new URLSearchParams(location.search);
      let mode = q.get("month") ? "month" : q.get("day") && q.get("day") !== today ? "day" : "today";
      let day = q.get("day") || today;
      let month = q.get("month") || today.slice(0, 7);
      let includeTests = q.get("tests") === "1";
      let R = null; // tos_overview_range result
      let updatedAt = null;
      let loadError = null;

      const MODES = [["today", "Today"], ["day", "Day"], ["month", "Month"]];
      const pad = (n) => String(n).padStart(2, "0");
      const monthEnd = (m) => { const [y, mo] = m.split("-").map(Number); return `${m}-${pad(new Date(Date.UTC(y, mo, 0)).getUTCDate())}`; };
      const shiftDay = (d, n) => new Date(Date.parse(`${d}T12:00:00Z`) + n * 864e5).toISOString().slice(0, 10);
      const shiftMonth = (m, n) => { const [y, mo] = m.split("-").map(Number); const t = new Date(Date.UTC(y, mo - 1 + n, 1)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}`; };
      const dayLabel = (d) => new Date(`${d}T12:00:00+08:00`).toLocaleDateString("en-PH", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
      const monthLabel = (m) => new Date(`${m}-15T12:00:00+08:00`).toLocaleDateString("en-PH", { month: "long", year: "numeric" });

      function saveUrl() {
        const p = new URLSearchParams();
        if (mode === "day") p.set("day", day);
        if (mode === "month") p.set("month", month);
        if (includeTests) p.set("tests", "1");
        history.replaceState(null, "", p.toString() ? `?${p}` : location.pathname);
      }

      function renderControls() {
        document.getElementById("mode").innerHTML = MODES.map(
          ([k, l]) => `<button type="button" data-mode="${k}" aria-pressed="${k === mode}">${l}</button>`
        ).join("");
        const pick = document.getElementById("pick");
        if (mode === "today") pick.innerHTML = "";
        else if (mode === "day")
          pick.innerHTML = `<button type="button" class="btn-outline" data-step="-1" aria-label="Previous day">‹</button>
            <input type="date" id="day" value="${day}" max="${shiftDay(today, 60)}" />
            <button type="button" class="btn-outline" data-step="1" aria-label="Next day">›</button>`;
        else
          pick.innerHTML = `<button type="button" class="btn-outline" data-step="-1" aria-label="Previous month">‹</button>
            <input type="month" id="month" value="${month}" />
            <button type="button" class="btn-outline" data-step="1" aria-label="Next month">›</button>`;
        document.getElementById("tests-wrap").classList.remove("hidden");
        document.getElementById("tests").checked = includeTests;
        document.getElementById("live").classList.toggle("hidden", mode !== "today");
        const period = mode === "today" ? "Today" : mode === "day" ? dayLabel(day) : monthLabel(month);
        document.getElementById("eyebrow").textContent = `Terminal Operations · ${period}`;
        const what = mode === "today" ? "today, so far" : mode === "day" ? "the whole day" : "the whole month";
        document.getElementById("sub").textContent =
          `On-time and late arrivals and departures for ${what}. ${includeTests ? "Test reads included." : "Test reads are not counted."}`;
      }

      async function load() {
        const from = mode === "month" ? `${month}-01` : mode === "day" ? day : today;
        const to = mode === "month" ? monthEnd(month) : mode === "day" ? day : today;
        const { data, error } = await supabase.rpc("tos_overview_range", { p_from: from, p_to: to, p_include_tests: includeTests });
        if (error) {
          loadError = error;
          showMessage("message", `Could not load gate data: ${error.message}`);
        } else {
          R = data;
          loadError = null;
          updatedAt = new Date();
          showMessage("message", "");
        }
        render();
      }

      async function setPeriod() {
        if (mode === "day" && day === today) mode = "today";
        saveUrl();
        renderControls();
        R = null;
        document.getElementById("kpis").innerHTML = `<p class="tos-none">Loading…</p>`;
        await load();
      }

      const kpi = (label, value, sub, tone) =>
        `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value"><strong style="font-size:26px${tone ? `;color:var(${tone})` : ""}">${value}</strong></div><div class="subtle">${sub}</div></div>`;

      // On-time (blue) and late (red) bars per hour or per day. bars: [{ label, a, d, hl, day }]
      function drawBars(bars, aria, labelEvery, what) {
        const W = 720, H = 230, pl = 34, pb = 26, pt = 10;
        const ymax = Math.max(5, Math.ceil(Math.max(...bars.map((d) => Math.max(d.a, d.d))) / 5) * 5);
        const bw = (W - pl - 6) / bars.length;
        const y = (v) => pt + (H - pt - pb) * (1 - v / ymax);
        let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`;
        [0, ymax / 2, ymax].forEach((v) => {
          svg += `<line x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--divider)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--label)">${v}</text>`;
        });
        bars.forEach((d, i) => {
          const x = pl + i * bw + bw * 0.14, w = bw * 0.34;
          if (d.day) svg += `<rect data-day="${d.day}" x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent" style="cursor:pointer"><title>${d.day}: ${d.a} on time, ${d.d} late ${what}. Click to open the day.</title></rect>`;
          if (d.a) svg += `<rect x="${x}" y="${y(d.a)}" width="${w}" height="${y(0) - y(d.a)}" rx="2" fill="var(--blue)" pointer-events="none"/>`;
          if (d.d) svg += `<rect x="${x + w + 2}" y="${y(d.d)}" width="${w}" height="${y(0) - y(d.d)}" rx="2" fill="var(--red-ink)" pointer-events="none"/>`;
          if (i % labelEvery === 0 || d.hl)
            svg += `<text x="${pl + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${d.hl ? "var(--text)" : "var(--label)"}" font-weight="${d.hl ? 700 : 500}" pointer-events="none">${d.label}</text>`;
        });
        return svg + "</svg>";
      }

      function render() {
        document.getElementById("live").innerHTML = liveText(updatedAt, loadError);
        const note = document.getElementById("note");
        if (!R) return;
        const t = R.totals;
        const arrived = t.on_time_arrivals + t.late_arrivals;
        const departed = t.on_time_departures + t.late_departures;
        const pct = (a, b, what) => (b ? `${Math.round((a / b) * 100)}% of ${b} ${what}` : `No ${what} yet`);
        document.getElementById("kpis").innerHTML = [
          kpi("On-time arrivals", t.on_time_arrivals, `${pct(t.on_time_arrivals, arrived, "arrivals")} · in by bay window + ${R.grace_min} min`, "--blue"),
          kpi("Late arrivals", t.late_arrivals, `${pct(t.late_arrivals, arrived, "arrivals")} · after the ${R.grace_min}-min grace`, "--red-ink"),
          kpi("On-time departures", t.on_time_departures, `${pct(t.on_time_departures, departed, "departures")} · left by ETD + ${R.grace_min} min`, "--blue"),
          kpi("Late departures", t.late_departures, `${pct(t.late_departures, departed, "departures")} · left after ETD + ${R.grace_min} min`, "--red-ink"),
        ].join("");
        note.classList.toggle("hidden", !(t.trips && !arrived && !departed));
        note.textContent = `${t.trips} approved trip${t.trips === 1 ? "" : "s"} in this period, but no arrivals or departures were recorded. Until the gate cameras are connected, only test reads (tick "Include test reads") show here.`;

        const cur = Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Manila", hour: "2-digit", hourCycle: "h23" }).format(new Date()));
        const perDay = mode === "month";
        document.getElementById("arr-title").textContent = perDay ? "Arrivals per day" : "Arrivals per hour";
        document.getElementById("dep-title").textContent = perDay ? "Departures per day" : "Departures per hour";
        const rows = perDay
          ? R.daily.map((d) => ({ label: String(+d.day.slice(8)), day: d.day, hl: d.day === today, ...d }))
          : R.hourly.filter((h) => h.hour >= 4 || h.on_time_arrivals + h.late_arrivals + h.on_time_departures + h.late_departures > 0)
              .map((h) => ({ label: pad(h.hour), hl: mode === "today" && h.hour === cur, ...h }));
        const arr = rows.map((r) => ({ label: r.label, day: r.day, hl: r.hl, a: +r.on_time_arrivals, d: +r.late_arrivals }));
        const dep = rows.map((r) => ({ label: r.label, day: r.day, hl: r.hl, a: +r.on_time_departures, d: +r.late_departures }));
        document.getElementById("arr-chart").innerHTML = drawBars(arr, document.getElementById("arr-title").textContent, perDay ? 3 : 2, "arrivals");
        document.getElementById("dep-chart").innerHTML = drawBars(dep, document.getElementById("dep-title").textContent, perDay ? 3 : 2, "departures");
      }

      document.addEventListener("click", (e) => {
        if (e.target.closest('[data-act="refresh"]')) load();
        const m = e.target.closest("[data-mode]");
        if (m) {
          mode = m.dataset.mode;
          if (mode === "day" && day === today) day = shiftDay(today, -1); // Day starts on yesterday; Today refreshes on its own
          setPeriod();
        }
        const step = e.target.closest("[data-step]");
        if (step) {
          const n = Number(step.dataset.step);
          if (mode === "day") day = shiftDay(day, n);
          else month = shiftMonth(month, n);
          setPeriod();
        }
        const bar = e.target.closest("[data-day]");
        if (bar) {
          mode = "day";
          day = bar.dataset.day;
          setPeriod();
        }
      });
      document.getElementById("pick").addEventListener("change", (e) => {
        if (e.target.id === "day" && e.target.value) day = e.target.value;
        else if (e.target.id === "month" && e.target.value) month = e.target.value;
        else return;
        setPeriod();
      });
      document.getElementById("tests").addEventListener("change", (e) => {
        includeTests = e.target.checked;
        setPeriod();
      });
      // Today keeps itself current while the page is visible.
      setInterval(() => mode === "today" && document.visibilityState === "visible" && load(), 20000);
      setPeriod();
    </script>
  </body>
</html>
