<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview · PITX Terminal Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <link rel="stylesheet" href="assets/tos.css?v=20261030-1" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="nav"></aside>
      <div class="app-content">
        <main class="wrap">
          <div class="page-head">
            <div>
              <p class="eyebrow" id="eyebrow">Terminal Operations &middot; Today</p>
              <h1>Overview</h1>
              <p class="subtle" id="sub">Gate activity for today, from the first bus in to now.</p>
            </div>
            <div class="tos-head-right">
              <span id="live"></span>
              <button type="button" class="btn-outline" data-act="refresh">Refresh</button>
            </div>
          </div>

          <div class="toolbar" style="margin-bottom: 14px; flex-wrap: wrap; gap: 10px; align-items: center">
            <div class="tos-seg" role="group" aria-label="Period" id="mode"></div>
            <div class="tos-actions" id="pick" style="align-items: center"></div>
            <label class="subtle hidden" id="tests-wrap" style="display: inline-flex; gap: 6px; align-items: center">
              <input type="checkbox" id="tests" /> Include test reads
            </label>
          </div>

          <div class="hidden" id="message"></div>
          <p class="subtle hidden" id="note" style="margin: 0 0 12px"></p>
          <div class="kpis" id="kpis"></div>
          <div class="tos-split" style="grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr)">
            <section class="table-wrap">
              <div class="tos-panel-head">
                <h3 id="chart-title">Gate entries per hour</h3>
                <div class="tos-leg"><span style="--c: var(--blue)">Let in</span><span style="--c: var(--red-ink)">Turned away</span></div>
              </div>
              <div class="tos-chart" id="chart" style="padding: 14px 16px"></div>
            </section>
            <section class="table-wrap">
              <div class="tos-panel-head"><h3>Why buses were stopped</h3></div>
              <div id="reasons"></div>
            </section>
          </div>
          <section class="table-wrap" style="margin-top: 18px" id="expected-wrap">
            <div class="tos-panel-head"><h3>Expected at the gates</h3><span class="subtle">Next 2 hours</span></div>
            <div id="expected"></div>
          </section>
        </main>
      </div>
    </div>

    <script type="module">
      import {
        guardPage,
        renderNav,
        escapeHtml,
        showMessage,
        startLive,
        liveText,
        tripStatus,
        expectedTrips,
        gateReadiness,
        expectedHtml,
        supabase,
        manilaToday,
      } from "./assets/tos.js?v=20261030-1";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      /* ---- period: Today (live), one Day, or one Month. Kept in the link. */
      const today = manilaToday();
      const q = new URLSearchParams(location.search);
      let mode = q.get("month") ? "month" : q.get("day") && q.get("day") !== today ? "day" : "today";
      let day = q.get("day") || today;
      let month = q.get("month") || today.slice(0, 7);
      let includeTests = q.get("tests") === "1";
      let R = null; // tos_overview_range result for Day / Month

      const MODES = [["today", "Today"], ["day", "Day"], ["month", "Month"]];
      const pad = (n) => String(n).padStart(2, "0");
      const monthEnd = (m) => { const [y, mo] = m.split("-").map(Number); return `${m}-${pad(new Date(Date.UTC(y, mo, 0)).getUTCDate())}`; };
      const shiftDay = (d, n) => new Date(Date.parse(`${d}T12:00:00Z`) + n * 864e5).toISOString().slice(0, 10);
      const shiftMonth = (m, n) => { const [y, mo] = m.split("-").map(Number); const t = new Date(Date.UTC(y, mo - 1 + n, 1)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}`; };
      const dayLabel = (d) => new Date(`${d}T12:00:00+08:00`).toLocaleDateString("en-PH", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
      const monthLabel = (m) => new Date(`${m}-15T12:00:00+08:00`).toLocaleDateString("en-PH", { month: "long", year: "numeric" });

      function saveUrl() {
        const p = new URLSearchParams();
        if (mode === "day") p.set("day", day);
        if (mode === "month") p.set("month", month);
        if (mode !== "today" && includeTests) p.set("tests", "1");
        history.replaceState(null, "", p.toString() ? `?${p}` : location.pathname);
      }

      function renderControls() {
        document.getElementById("mode").innerHTML = MODES.map(
          ([k, l]) => `<button type="button" data-mode="${k}" aria-pressed="${k === mode}">${l}</button>`
        ).join("");
        const pick = document.getElementById("pick");
        if (mode === "today") pick.innerHTML = "";
        else if (mode === "day")
          pick.innerHTML = `<button type="button" class="btn-outline" data-step="-1" aria-label="Previous day">‹</button>
            <input type="date" id="day" value="${day}" max="${shiftDay(today, 60)}" />
            <button type="button" class="btn-outline" data-step="1" aria-label="Next day">›</button>`;
        else
          pick.innerHTML = `<button type="button" class="btn-outline" data-step="-1" aria-label="Previous month">‹</button>
            <input type="month" id="month" value="${month}" />
            <button type="button" class="btn-outline" data-step="1" aria-label="Next month">›</button>`;
        document.getElementById("tests-wrap").classList.toggle("hidden", mode === "today");
        document.getElementById("tests").checked = includeTests;
        document.getElementById("live").classList.toggle("hidden", mode !== "today");
        document.getElementById("expected-wrap").classList.toggle("hidden", mode !== "today");
        const period = mode === "today" ? "Today" : mode === "day" ? dayLabel(day) : monthLabel(month);
        document.getElementById("eyebrow").textContent = `Terminal Operations · ${period}`;
        document.getElementById("sub").textContent =
          mode === "today"
            ? "Gate activity for today, from the first bus in to now."
            : `Gate activity for ${mode === "day" ? "the whole day" : "the whole month"}. ${includeTests ? "Test reads included." : "Test reads are not counted."}`;
      }

      async function loadRange() {
        const from = mode === "day" ? day : `${month}-01`;
        const to = mode === "day" ? day : monthEnd(month);
        const { data, error } = await supabase.rpc("tos_overview_range", { p_from: from, p_to: to, p_include_tests: includeTests });
        if (error) {
          R = null;
          showMessage("message", `Could not load gate data: ${error.message}`);
        } else {
          R = data;
          showMessage("message", "");
        }
        render();
      }

      async function setPeriod() {
        if (mode === "day" && day === today) mode = "today";
        saveUrl();
        renderControls();
        if (mode === "today") {
          R = null;
          ensureLive();
          render();
        } else {
          document.getElementById("kpis").innerHTML = `<p class="tos-none">Loading…</p>`;
          await loadRange();
        }
      }

      let M = null;
      let updatedAt = null;
      let loadError = null;
      let live = null;

      // Today polls tos_snapshot; started only when Today is shown.
      function ensureLive() {
        if (live) return live.refresh();
        live = startLive({
          onData: (model, at) => {
            M = model;
            updatedAt = at;
            loadError = null;
            if (mode === "today") showMessage("message", "");
            render();
          },
          onError: (error) => {
            loadError = error;
            if (mode === "today") showMessage("message", `Could not load gate data: ${error.message}`);
            render();
          },
        });
      }

      const kpi = (label, value, sub) =>
        `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value"><strong style="font-size:26px">${value}</strong></div><div class="subtle">${sub}</div></div>`;

      // Bars for let in / turned away, one pair per slot. bars: [{ label, a, d, hl, day }]
      function drawBars(bars, aria, labelEvery) {
        const W = 720, H = 230, pl = 34, pb = 26, pt = 10;
        const ymax = Math.max(5, Math.ceil(Math.max(...bars.map((d) => Math.max(d.a, d.d))) / 5) * 5);
        const bw = (W - pl - 6) / bars.length;
        const y = (v) => pt + (H - pt - pb) * (1 - v / ymax);
        let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`;
        [0, ymax / 2, ymax].forEach((v) => {
          svg += `<line x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--divider)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--label)">${v}</text>`;
        });
        bars.forEach((d, i) => {
          const x = pl + i * bw + bw * 0.14, w = bw * 0.34;
          if (d.day) svg += `<rect data-day="${d.day}" x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent" style="cursor:pointer"><title>${d.day}: ${d.a} let in, ${d.d} turned away. Click to open the day.</title></rect>`;
          if (d.a) svg += `<rect x="${x}" y="${y(d.a)}" width="${w}" height="${y(0) - y(d.a)}" rx="2" fill="var(--blue)" pointer-events="none"/>`;
          if (d.d) svg += `<rect x="${x + w + 2}" y="${y(d.d)}" width="${w}" height="${y(0) - y(d.d)}" rx="2" fill="var(--red-ink)" pointer-events="none"/>`;
          if (i % labelEvery === 0 || d.hl)
            svg += `<text x="${pl + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${d.hl ? "var(--text)" : "var(--label)"}" font-weight="${d.hl ? 700 : 500}" pointer-events="none">${d.label}</text>`;
        });
        return svg + "</svg>";
      }

      function reasonsHtml(rows, empty) {
        return rows.length
          ? `<table><thead><tr><th>Reason</th><th>Stops</th><th>Let in after</th><th>Denied</th></tr></thead><tbody>${rows
              .map(([k, v]) => `<tr><td>${escapeHtml(k)}</td><td class="tos-num">${v.n}</td><td class="tos-num">${v.a}</td><td class="tos-num">${v.d}</td></tr>`)
              .join("")}</tbody></table>`
          : `<p class="tos-none">${empty}</p>`;
      }

      function renderRange() {
        const note = document.getElementById("note");
        if (!R) {
          document.getElementById("kpis").innerHTML = "";
          note.classList.add("hidden");
          return;
        }
        const t = R.totals;
        const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : "—");
        document.getElementById("kpis").innerHTML = [
          kpi("Trips booked", t.trips, `${t.no_plate} without a plate`),
          kpi("Buses let in", t.let_in, `of ${t.trips} trips`),
          kpi("On-time arrivals", pct(t.on_time, t.arrived), `within ${R.grace_min}-min grace`),
          kpi("Turned away", t.turned_away, `${t.unregistered} unregistered plates`),
          kpi("No-shows", t.no_shows, "bay window passed, bus never read"),
        ].join("");
        note.classList.toggle("hidden", !(t.trips && !t.let_in && !t.turned_away));
        note.textContent = "No gate reads were recorded in this period. Until the gate cameras are connected, every past trip counts as a no-show.";

        if (mode === "day") {
          document.getElementById("chart-title").textContent = "Gate entries per hour";
          const bars = R.hourly.map((h) => ({ label: pad(h.hour), a: +h.let_in, d: +h.turned_away }));
          document.getElementById("chart").innerHTML = drawBars(bars, "Gate entries per hour", 2);
        } else {
          document.getElementById("chart-title").textContent = "Gate entries per day";
          const bars = R.daily.map((d) => ({ label: String(+d.day.slice(8)), a: +d.let_in, d: +d.turned_away, day: d.day, hl: d.day === today }));
          document.getElementById("chart").innerHTML = drawBars(bars, "Gate entries per day", 3);
        }
        const rows = R.reasons.map((r) => [r.category, { n: r.stops, a: r.let_in_after, d: r.denied }]);
        document.getElementById("reasons").innerHTML = reasonsHtml(rows, `No buses stopped in this ${mode === "day" ? "day" : "month"}.`);
      }

      function render() {
        document.getElementById("live").innerHTML = liveText(updatedAt, loadError);
        if (mode !== "today") return renderRange();
        document.getElementById("note").classList.add("hidden");
        document.getElementById("chart-title").textContent = "Gate entries per hour";
        if (!M) return;
        const now = M.now();
        const entry = M.events.filter((e) => M.gates[e.gate]?.direction === "entry");
        const letIn = entry.filter((e) => e.opened);
        const refused = entry.filter((e) => e.decision === "DENY" || e.resolution === "DENIED");
        const arrived = M.trips.filter((t) => t.arrivedAt != null);
        const onTime = arrived.filter((t) => t.arrivedAt - t.slot <= M.rules.grace).length;
        const noPlate = M.trips.filter((t) => !t.plate).length;
        const noShows = M.trips.filter((t) => tripStatus(M, t, now) === "No-show").length;
        const expected = expectedTrips(M, 120, now);

        document.getElementById("kpis").innerHTML = [
          kpi("Buses let in", letIn.length, `of ${M.trips.filter((t) => t.slot <= now).length} trips due so far`),
          kpi("On-time arrivals", arrived.length ? `${Math.round((onTime / arrived.length) * 100)}%` : "—", `within ${M.rules.grace}-min grace`),
          kpi("Turned away", refused.length, `${entry.filter((e) => e.cat === "Unregistered vehicle").length} unregistered plates`),
          kpi("No-shows", noShows, "bay window passed, bus never read"),
          kpi("Trips without a plate", noPlate, `of ${M.trips.length} approved today`),
          kpi("Waiting for staff", M.pending().length, "at the gate now"),
          kpi("Expected next 2 hours", expected.length, expected.length ? `${expected.filter((t) => !gateReadiness(M, t)[2]).length} the camera can't match yet` : "no buses due"),
        ].join("");
        document.getElementById("expected").innerHTML = expectedHtml(M);

        // Per-hour bars, 04:00 to 22:00, current hour highlighted.
        const hourOf = (e) => Math.floor((e.resolvedAt ?? e.at) / 60);
        const cur = Math.floor(now / 60);
        const bars = Array.from({ length: 19 }, (_, i) => i + 4).map((h) => ({
          label: pad(h),
          a: letIn.filter((e) => hourOf(e) === h).length,
          d: refused.filter((e) => hourOf(e) === h).length,
          hl: h === cur,
        }));
        document.getElementById("chart").innerHTML = drawBars(bars, "Gate entries per hour", 2);

        const groups = {};
        entry
          .filter((e) => !(e.decision === "ALLOW" && !e.resolution))
          .forEach((e) => {
            const g = (groups[e.cat || "Other"] ??= { n: 0, a: 0, d: 0 });
            g.n++;
            if (e.resolution === "ALLOWED" || (e.decision === "HOLD" && M.byId[e.bid]?.arrivedAt != null)) g.a++;
            else if (e.decision === "DENY" || e.resolution === "DENIED") g.d++;
          });
        const rows = Object.entries(groups).sort((a, b) => b[1].n - a[1].n);
        document.getElementById("reasons").innerHTML = reasonsHtml(rows, "No buses stopped yet today.");
      }

      document.addEventListener("click", (e) => {
        if (e.target.closest('[data-act="refresh"]')) mode === "today" ? live?.refresh() : loadRange();
        const trip = e.target.closest('[data-act="trip"]');
        if (trip) location.href = `bays.html?trip=${encodeURIComponent(trip.dataset.id)}`;
        const m = e.target.closest("[data-mode]");
        if (m) {
          mode = m.dataset.mode;
          if (mode === "day" && day === today) day = shiftDay(today, -1); // Day starts on yesterday; Today is the live view
          setPeriod();
        }
        const step = e.target.closest("[data-step]");
        if (step) {
          const n = Number(step.dataset.step);
          if (mode === "day") day = shiftDay(day, n);
          else month = shiftMonth(month, n);
          setPeriod();
        }
        const bar = e.target.closest("[data-day]");
        if (bar) {
          mode = "day";
          day = bar.dataset.day;
          setPeriod();
        }
      });
      document.getElementById("pick").addEventListener("change", (e) => {
        if (e.target.id === "day" && e.target.value) day = e.target.value;
        else if (e.target.id === "month" && e.target.value) month = e.target.value;
        else return;
        setPeriod();
      });
      document.getElementById("tests").addEventListener("change", (e) => {
        includeTests = e.target.checked;
        setPeriod();
      });
      setInterval(() => mode === "today" && M && render(), 15000);
      setPeriod();
    </script>
  </body>
</html>
