<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehicles · PITX Trip Scheduling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <style>
      /* Small popover for the Columns toggle - the rest of the site has no
         existing dropdown component to reuse, so this is scoped to this
         page only and leans on the same tokens/radii as the shared sheet. */
      .columns-control {
        position: relative;
      }

      .columns-popover {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 30;
        min-width: 220px;
        max-height: 320px;
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid oklch(88% 0.006 260);
        border-radius: var(--r-card);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
        padding: 10px;
      }

      .columns-popover label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-2);
        padding: 5px 4px;
        border-radius: 6px;
        cursor: pointer;
      }

      .columns-popover label:hover {
        background: var(--ground);
      }

      .columns-popover input {
        margin: 0;
      }

      /* Operator / Trade name / Destination filters. Same popover as the
         Columns control above - these are checkbox lists too, so they
         reuse it rather than introducing a second dropdown idiom - plus
         a search box (there are ~65 operators and ~104 destinations) and
         a per-value count. */
      /* Capped, not just min-width: the longest destination
         ("BATANGAS CITY PIER (BATANGAS) - PLAZA LAWTON (MANILA)") would
         otherwise stretch the popover past a phone's viewport. Labels
         ellipsis instead, and the full text is in the row's title. */
      .filter-popover {
        min-width: 280px;
        max-width: min(92vw, 420px);
        left: 0;
        right: auto;
      }

      .filter-search {
        width: 100%;
        font-family: inherit;
        font-size: 12px;
        padding: 6px 9px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--ground);
        color: var(--text);
        margin-bottom: 8px;
      }

      .filter-options {
        max-height: 240px;
        overflow-y: auto;
      }

      /* The count sits hard right of each row, so the eye can scan
         quantities down one column instead of hunting after each label. */
      .filter-options label {
        justify-content: space-between;
      }

      .filter-option-label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .filter-option-label span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .filter-count {
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        color: var(--label, #6b7280);
        flex-shrink: 0;
        padding-left: 10px;
      }

      /* A value that no longer exists under the other filters, but which
         stays listed (and checkable) so the list doesn't reshuffle. */
      .filter-options label.is-empty {
        opacity: 0.45;
      }

      .filter-toggle.has-filter {
        border-color: var(--blue, #2f5fd0);
        color: var(--blue-ink, #1d2b6b);
        font-weight: 700;
      }

      .filter-empty {
        font-size: 12px;
        color: var(--faint, #9aa1b2);
        padding: 6px 4px;
      }

      .filter-clear {
        margin-top: 8px;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="nav"></aside>
      <div class="app-content">
        <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Fleet Database</p>
          <h1>Vehicles</h1>
          <p class="subtle">
            Every vehicle registered across all operators, any status - not
            just the pending queue on <strong>Vehicle approvals</strong>.
          </p>
        </div>
        <p class="subtle" id="summary-count"></p>
      </div>

      <div class="toolbar" style="justify-content: space-between; margin-bottom: 20px">
        <div class="field" style="max-width: 360px; margin-bottom: 0">
          <label for="search">Search</label>
          <input id="search" placeholder="Plate no., operator, body no., or route…" />
        </div>
        <div class="mode-switch" role="tablist" id="status-filter">
          <button type="button" class="mode-tab is-active" data-filter="all">All</button>
          <button type="button" class="mode-tab" data-filter="approved">Approved</button>
          <button type="button" class="mode-tab" data-filter="pending">Pending</button>
          <button type="button" class="mode-tab" data-filter="rejected">Declined</button>
        </div>
        <div class="columns-control">
          <button type="button" class="btn-outline" id="columns-toggle">Columns</button>
          <div class="columns-popover hidden" id="columns-popover"></div>
        </div>
        <details class="row-menu"><summary class="menu-btn" aria-label="More">&#8943;</summary><div class="row-menu-pop"><button type="button" class="btn-link" id="export-csv">Export CSV</button></div></details>
      </div>

      <div class="toolbar" style="margin-bottom: 20px; gap: 10px; justify-content: flex-start">
        <div class="columns-control filter-control" data-facet="operator">
          <button type="button" class="btn-outline filter-toggle">Operator</button>
          <div class="columns-popover filter-popover hidden">
            <input class="filter-search" type="search" placeholder="Find operator…" />
            <div class="filter-options"></div>
            <button type="button" class="btn-link filter-clear">Clear</button>
          </div>
        </div>
        <div class="columns-control filter-control" data-facet="trade">
          <button type="button" class="btn-outline filter-toggle">Trade name</button>
          <div class="columns-popover filter-popover hidden">
            <input class="filter-search" type="search" placeholder="Find trade name…" />
            <div class="filter-options"></div>
            <button type="button" class="btn-link filter-clear">Clear</button>
          </div>
        </div>
        <div class="columns-control filter-control" data-facet="destination">
          <button type="button" class="btn-outline filter-toggle">Destination</button>
          <div class="columns-popover filter-popover hidden">
            <input class="filter-search" type="search" placeholder="Find destination…" />
            <div class="filter-options"></div>
            <button type="button" class="btn-link filter-clear">Clear</button>
          </div>
        </div>
        <button type="button" class="btn-link hidden" id="clear-filters">Clear all filters</button>
      </div>

      <div class="hidden" id="message"></div>
      <div id="filter-note"></div>
      <div id="vehicle-list"></div>
    </main>
      </div>
    </div>

    <dialog class="details-dialog" id="details-dialog">
      <h2 class="dialog-title" id="details-title"></h2>
      <div id="details-body"></div>
      <div class="dialog-actions">
        <button type="button" class="btn-outline" id="details-close">Close</button>
      </div>
    </dialog>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        showMessage,
        statusBadge,
        expiryCell,
        busTypeLabel,
        vehicleDetailsHtml,
        applyVehicleHighlightFromQuery,
        escapeHtml,
        downloadCsv,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      let allVehicles = [];
      let vehiclesById = new Map();
      let statusFilter = "all";
      // ?filter=unlinked (linked from the Overview note): only approved vehicles
      // whose route isn't one of the terminal's routes - they can't be booked.
      // Declared up here, before the init calls, like the rest of this state.
      let unlinkedOnly = new URLSearchParams(location.search).get("filter") === "unlinked";
      let unlinkedIds = null; // Set of vehicle ids, loaded with the list
      let sortKey = null;
      let sortDir = "asc";

      // Operator / Trade name / Destination dropdown filters, combined
      // with AND (and with the status tabs and search box). What each one
      // reads off a vehicle lives here; adding another filter is an entry
      // here plus a <select> in the toolbar - everything below is driven
      // by this map. Declared with the rest of the module state, ahead of
      // the init calls further down, so nothing reads it while it's still
      // in its temporal dead zone (the recurring bug class here - see #87).
      const FILTERS = {
        operator: (v) => v.profiles?.operator_name || v.profiles?.username || null,
        trade: (v) => v.trade_name || null,
        destination: (v) => v.destination || null,
      };
      const NOT_SET = "(not set)";
      const FILTER_NOUNS = {
        operator: "operator",
        trade: "trade name",
        destination: "destination",
      };
      const filterValue = (facet, v) => FILTERS[facet](v) ?? NOT_SET;
      // Multi-select: values picked within one filter are OR'd, and the
      // three filters are AND'd together. An empty set = not filtering.
      const filterSelected = Object.fromEntries(
        Object.keys(FILTERS).map((f) => [f, new Set()])
      );
      // Supabase caps a single request at 1000 rows (PostgREST's default
      // max-rows setting) - the masterlist import (migration 0021/0022,
      // ~1,900 rows) pushed this table past that. Must be declared before
      // load() runs below, or it's still in its temporal dead zone.
      const PAGE_SIZE = 1000;

      // Every column the table can show, in on-screen order. `csv` renders
      // the plain-text value for export - separate from the `<td>` markup
      // below since several columns (status badge, bus type) render as
      // HTML on screen but should be plain text in the exported file. No
      // LTFRB column here anymore - staff review that on the vehicle's own
      // detail card (still shown there) rather than as a column on this
      // summary table.
      const COLUMNS = [
        { key: "plate_no", label: "Plate No.", csv: (v) => v.plate_no ?? "" },
        {
          key: "operator",
          label: "Operator",
          csv: (v) => v.profiles?.operator_name || v.profiles?.username || "",
        },
        { key: "status", label: "Status", csv: (v) => v.status ?? "" },
        { key: "route", label: "Route", csv: (v) => v.route ?? "" },
        { key: "origin", label: "Origin", csv: (v) => v.origin ?? "" },
        { key: "destination", label: "Destination", csv: (v) => v.destination ?? "" },
        { key: "case_number", label: "Case No.", csv: (v) => v.case_number ?? "" },
        { key: "mv_file_number", label: "MV File #", csv: (v) => v.mv_file_number ?? "" },
        { key: "chassis_no", label: "Chassis No.", csv: (v) => v.chassis_no ?? "" },
        { key: "franchise", label: "Franchise", csv: (v) => v.franchise ?? "" },
        { key: "sticker_no", label: "Sticker No.", csv: (v) => v.sticker_no ?? "" },
        { key: "cpc_validity", label: "CPC validity", csv: (v) => v.cpc_validity ?? "" },
        { key: "cpc_eov", label: "CPC EOV?", csv: (v) => (v.cpc_eov ? "Yes" : "No") },
        { key: "cpc_eov_validity", label: "EOV validity", csv: (v) => v.cpc_eov_validity ?? "" },
        { key: "orcr_validity", label: "OR/CR validity", csv: (v) => v.orcr_validity ?? "" },
        { key: "body_number", label: "Body Number", csv: (v) => v.body_number ?? "" },
        { key: "trade_name", label: "Trade Name", csv: (v) => v.trade_name ?? "" },
        { key: "vehicle_year", label: "Year", csv: (v) => v.vehicle_year ?? "" },
        { key: "vehicle_make", label: "Make", csv: (v) => v.vehicle_make ?? "" },
        { key: "bus_type", label: "Bus Type", csv: (v) => busTypeLabel(v.bus_type) },
        { key: "seating_capacity", label: "Seating", csv: (v) => v.seating_capacity ?? "" },
        { key: "seat_type", label: "Seat configuration", csv: (v) => v.seat_type ?? "" },
        { key: "remarks", label: "Remarks", csv: (v) => v.remarks ?? "" },
        { key: "rejection_reason", label: "Note", csv: (v) => v.rejection_reason ?? "" },
        { key: "documents", label: "Documents", csv: () => "" },
      ];

      // Default subset shown on first visit - the rest stay one click away
      // via the Columns popover. Whatever the staff member picks after that
      // persists in localStorage under this key, so it survives a reload.
      // Bumped to v2 when the vehicle field set changed (migration 0035).
      const COLUMNS_STORAGE_KEY = "pitx.vehiclesDatabase.columns.v2";
      const DEFAULT_VISIBLE_COLUMNS = [
        "plate_no",
        "operator",
        "route",
        "body_number",
        "status",
        "cpc_validity",
        "orcr_validity",
      ];
      let visibleColumns = loadVisibleColumns();

      function loadVisibleColumns() {
        try {
          const stored = JSON.parse(localStorage.getItem(COLUMNS_STORAGE_KEY));
          if (Array.isArray(stored) && stored.length) {
            const validKeys = new Set(COLUMNS.map((c) => c.key));
            return new Set(stored.filter((key) => validKeys.has(key)));
          }
        } catch {
          // ignore malformed/absent localStorage value, fall back to defaults
        }
        return new Set(DEFAULT_VISIBLE_COLUMNS);
      }

      function saveVisibleColumns() {
        localStorage.setItem(COLUMNS_STORAGE_KEY, JSON.stringify([...visibleColumns]));
      }

      initStatusFilter();
      initDetailsDialog();
      initColumnsPopover();
      initFilters();
      document.getElementById("search").addEventListener("input", render);
      document.getElementById("export-csv").addEventListener("click", exportCsv);
      await load();
      applyVehicleHighlightFromQuery(openDetails);

      function initColumnsPopover() {
        const toggle = document.getElementById("columns-toggle");
        const popover = document.getElementById("columns-popover");

        popover.innerHTML = COLUMNS.map(
          (col) => `
            <label>
              <input type="checkbox" data-col-toggle="${col.key}" ${
            visibleColumns.has(col.key) ? "checked" : ""
          } />
              ${escapeHtml(col.label)}
            </label>`
        ).join("");

        toggle.addEventListener("click", (e) => {
          e.stopPropagation();
          const opening = popover.classList.contains("hidden");
          closeAllFilterPopovers();
          popover.classList.toggle("hidden", !opening);
        });

        popover.querySelectorAll("[data-col-toggle]").forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            const key = checkbox.dataset.colToggle;
            if (checkbox.checked) visibleColumns.add(key);
            else visibleColumns.delete(key);
            saveVisibleColumns();
            applyColumnVisibility();
          });
        });

        // Clicking anywhere outside the popover closes it, same as a
        // standard dropdown.
        document.addEventListener("click", (e) => {
          if (!popover.classList.contains("hidden") && !e.target.closest(".columns-control")) {
            popover.classList.add("hidden");
          }
        });
      }

      // Re-applied after every render() since the table markup is rebuilt
      // from scratch on each search/filter/sort change.
      function applyColumnVisibility() {
        document.querySelectorAll("[data-col]").forEach((cell) => {
          cell.classList.toggle("hidden", !visibleColumns.has(cell.dataset.col));
        });
      }

      function exportCsv() {
        const rows = currentRows();
        const columns = COLUMNS.filter((col) => visibleColumns.has(col.key));
        downloadCsv(
          "vehicles.csv",
          columns.map((col) => col.label),
          rows.map((v) => columns.map((col) => col.csv(v)))
        );
      }

      function initStatusFilter() {
        document.querySelectorAll("#status-filter [data-filter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            statusFilter = btn.dataset.filter;
            document
              .querySelectorAll("#status-filter [data-filter]")
              .forEach((b) => b.classList.toggle("is-active", b === btn));
            render();
          });
        });
      }

      // Plate No., Operator, Route, CPC validity, OR/CR validity are
      // sortable - click a header to sort by it, click again to flip
      // direction. Nulls always sort last regardless of direction, so an
      // empty validity date (or unlinked route) doesn't jump to the top
      // on descending sort.
      const SORT_VALUE = {
        plate_no: (v) => v.plate_no?.toUpperCase() ?? null,
        operator: (v) => (v.profiles?.operator_name || v.profiles?.username)?.toUpperCase() ?? null,
        route: (v) => v.route?.toUpperCase() ?? null,
        cpc_validity: (v) => v.cpc_validity ?? null,
        orcr_validity: (v) => v.orcr_validity ?? null,
      };

      function sortTh(label, key) {
        const active = sortKey === key;
        const arrow = active ? (sortDir === "asc" ? " &#9650;" : " &#9660;") : "";
        return `<th class="sortable" data-sort="${key}" data-col="${key}">${escapeHtml(label)}${arrow}</th>`;
      }

      function applySort(rows) {
        if (!sortKey) return rows;
        const getValue = SORT_VALUE[sortKey];
        const dir = sortDir === "asc" ? 1 : -1;
        return [...rows].sort((a, b) => {
          const av = getValue(a);
          const bv = getValue(b);
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (av < bv) return -1 * dir;
          if (av > bv) return 1 * dir;
          return 0;
        });
      }

      // Pages through with .range() until a page comes back short of the
      // page size, so a plain .select() no longer silently truncates the
      // fleet list once it's past 1000 rows.
      async function load() {
        allVehicles = [];
        let from = 0;
        for (;;) {
          // vehicles has two FKs into profiles (operator_id, decided_by), so
          // the embed needs the constraint name to disambiguate which.
          const { data, error } = await supabase
            .from("vehicles")
            .select(
              "id, plate_no, case_number, mv_file_number, chassis_no, franchise, cpc_validity, cpc_eov, cpc_eov_validity, orcr_validity, sticker_no, route, origin, destination, body_number, trade_name, vehicle_year, vehicle_make, bus_type, seating_capacity, seat_type, remarks, status, ltfrb_status, rejection_reason, photo_path, supporting_doc_path, supporting_doc_name, seat_layout_path, seat_layout_name, created_at, profiles!vehicles_operator_id_fkey ( username, operator_name )"
            )
            .order("created_at", { ascending: false })
            .range(from, from + PAGE_SIZE - 1);

          if (error) {
            showMessage("message", error.message);
            return;
          }

          allVehicles.push(...(data ?? []));
          if (!data || data.length < PAGE_SIZE) break;
          from += PAGE_SIZE;
        }
        vehiclesById = new Map(allVehicles.map((v) => [v.id, v]));
        if (unlinkedOnly) {
          const { data: unlinked, error: unlinkedErr } = await supabase.rpc("vehicles_with_unlinked_route");
          if (unlinkedErr) showMessage("message", unlinkedErr.message);
          unlinkedIds = new Set((unlinked ?? []).map((r) => r.vehicle_id));
        }
        render();
      }

      /* -------------------------------------------------- details dialog */

      function initDetailsDialog() {
        document
          .getElementById("details-close")
          .addEventListener("click", () => document.getElementById("details-dialog").close());
      }

      async function openDetails(vehicleId) {
        const v = vehiclesById.get(vehicleId);
        if (!v) return;

        const operatorLabel = v.profiles?.operator_name || v.profiles?.username || "—";
        document.getElementById("details-title").textContent = v.plate_no;
        document.getElementById("details-body").innerHTML = vehicleDetailsHtml(v, operatorLabel);
        document.getElementById("details-dialog").showModal();

        const links = [];
        if (v.photo_path) {
          const { data } = await supabase.storage.from("vehicle-docs").createSignedUrl(v.photo_path, 300);
          if (data?.signedUrl) links.push(`<a href="${data.signedUrl}" target="_blank" rel="noopener">OR/CR photo</a>`);
        }
        if (v.supporting_doc_path) {
          const { data } = await supabase.storage.from("vehicle-docs").createSignedUrl(v.supporting_doc_path, 300);
          if (data?.signedUrl) {
            links.push(
              `<a href="${data.signedUrl}" target="_blank" rel="noopener">${escapeHtml(
                v.supporting_doc_name || "Supporting doc"
              )}</a>`
            );
          }
        }
        const docsEl = document.getElementById("details-documents");
        if (docsEl) docsEl.innerHTML = links.length ? links.join("") : "—";
      }

      // Status tabs + free-text search, without the dropdown filters -
      // split out so each dropdown can build its own option list from
      // everything the *other* filters still allow.
      function baseRows() {
        const query = document.getElementById("search").value.trim().toLowerCase();

        let rows =
          statusFilter === "all"
            ? allVehicles
            : allVehicles.filter((v) => v.status === statusFilter);
        if (unlinkedOnly && unlinkedIds) rows = rows.filter((v) => unlinkedIds.has(v.id));

        if (query) {
          rows = rows.filter((v) =>
            [v.plate_no, v.body_number, v.trade_name, v.profiles?.operator_name, v.profiles?.username, v.route]
              .filter(Boolean)
              .some((s) => s.toLowerCase().includes(query))
          );
        }
        return rows;
      }

      // Applies every dropdown except `skip`. Skipping a filter's own
      // value is what keeps its options from collapsing to just the one
      // already picked, while still narrowing the other two.
      function applyFilters(rows, skip = null) {
        for (const facet of Object.keys(FILTERS)) {
          if (facet === skip) continue;
          const picked = filterSelected[facet];
          if (picked.size === 0) continue;
          rows = rows.filter((v) => picked.has(filterValue(facet, v)));
        }
        return rows;
      }

      // Shared by render() and exportCsv() so the CSV always matches
      // exactly what's on screen - same status filter, search, dropdown
      // filters, and sort.
      function currentRows() {
        return applySort(applyFilters(baseRows()));
      }

      // Each filter's list is built from what the *other* filters still
      // allow, with a count per value. Its own selections are skipped in
      // that calculation, so ticking one operator doesn't hide the rest -
      // otherwise you could never select a second one.
      function renderFilters() {
        const base = baseRows();
        let any = false;

        for (const facet of Object.keys(FILTERS)) {
          const panel = document.querySelector(`.filter-control[data-facet="${facet}"]`);
          const host = panel.querySelector(".filter-options");
          const picked = filterSelected[facet];
          const term = panel.querySelector(".filter-search").value.trim().toLowerCase();
          if (picked.size > 0) any = true;

          const counts = new Map();
          for (const v of applyFilters(base, facet)) {
            const key = filterValue(facet, v);
            counts.set(key, (counts.get(key) ?? 0) + 1);
          }
          // Options come from the unfiltered base, so the list stays put
          // as you tick things; a value the others exclude shows 0.
          const options = [...new Set(base.map((v) => filterValue(facet, v)))].sort((a, b) => {
            if (a === NOT_SET) return 1; // "(not set)" last
            if (b === NOT_SET) return -1;
            return a.localeCompare(b);
          });
          const shown = term ? options.filter((o) => o.toLowerCase().includes(term)) : options;

          host.innerHTML = shown.length
            ? shown
                .map((opt) => {
                  const n = counts.get(opt) ?? 0;
                  const on = picked.has(opt);
                  return `<label class="${n === 0 && !on ? "is-empty" : ""}" title="${escapeHtml(
                    opt
                  )}">
                      <span class="filter-option-label">
                        <input type="checkbox" data-value="${escapeHtml(opt)}"${on ? " checked" : ""} />
                        <span>${escapeHtml(opt)}</span>
                      </span>
                      <span class="filter-count">${n}</span>
                    </label>`;
                })
                .join("")
            : `<p class="filter-empty">No matches.</p>`;

          // The button carries the state, since the popover is usually
          // shut - "Operator" alone, one name when that's all it is, or
          // a count once naming them would be too long.
          const toggle = panel.querySelector(".filter-toggle");
          const noun = FILTER_NOUNS[facet];
          const nounLabel = noun[0].toUpperCase() + noun.slice(1);
          toggle.textContent =
            picked.size === 0
              ? nounLabel
              : picked.size === 1
                ? `${nounLabel}: ${[...picked][0]}`
                : `${nounLabel}: ${picked.size} selected`;
          toggle.classList.toggle("has-filter", picked.size > 0);
          panel.querySelector(".filter-clear").classList.toggle("hidden", picked.size === 0);
        }

        document.getElementById("clear-filters").classList.toggle("hidden", !any);
      }

      function initFilters() {
        document.querySelectorAll(".filter-control").forEach((panel) => {
          const facet = panel.dataset.facet;
          const popover = panel.querySelector(".filter-popover");

          panel.querySelector(".filter-toggle").addEventListener("click", (e) => {
            e.stopPropagation();
            const opening = popover.classList.contains("hidden");
            closeAllFilterPopovers();
            if (opening) {
              popover.classList.remove("hidden");
              panel.querySelector(".filter-search").focus();
            }
          });

          // Bound to the container, not each checkbox - the list is
          // re-rendered on every tick, so per-checkbox listeners would
          // need re-attaching each time.
          panel.querySelector(".filter-options").addEventListener("change", (e) => {
            const box = e.target.closest("input[type=checkbox]");
            if (!box) return;
            const picked = filterSelected[facet];
            if (box.checked) picked.add(box.dataset.value);
            else picked.delete(box.dataset.value);
            render();
          });

          panel.querySelector(".filter-search").addEventListener("input", renderFilters);
          panel.querySelector(".filter-clear").addEventListener("click", () => {
            filterSelected[facet].clear();
            render();
          });
          // Clicks inside the popover shouldn't reach the document
          // handler that closes it.
          popover.addEventListener("click", (e) => e.stopPropagation());
        });

        document.getElementById("clear-filters").addEventListener("click", () => {
          for (const f of Object.keys(FILTERS)) filterSelected[f].clear();
          render();
        });
        document.addEventListener("click", closeAllFilterPopovers);
      }

      // Closes the Columns popover too, so at most one popover in this
      // toolbar is ever open - they'd otherwise overlap, since both
      // anchor to the same row.
      function closeAllFilterPopovers() {
        document
          .querySelectorAll(".filter-popover")
          .forEach((p) => p.classList.add("hidden"));
        document.getElementById("columns-popover")?.classList.add("hidden");
      }

      function renderFilterNote(count) {
        const note = document.getElementById("filter-note");
        if (!unlinkedOnly) {
          note.innerHTML = "";
          return;
        }
        note.innerHTML = `
          <p class="hint">
            Showing <strong>${count} approved vehicle${count === 1 ? "" : "s"}</strong> whose route isn't one
            of the terminal's routes, so operators can't book with ${count === 1 ? "it" : "them"}.
            Open a vehicle and set its route to make it bookable.
            <button type="button" class="btn-link" id="show-all-vehicles">Show all vehicles</button>
          </p>`;
        document.getElementById("show-all-vehicles").addEventListener("click", () => {
          unlinkedOnly = false;
          history.replaceState(null, "", "vehicles-database.html");
          render();
        });
      }

      function render() {
        renderFilters();
        const rows = currentRows();
        renderFilterNote(rows.length);

        // Says how many are showing whenever anything is narrowing the
        // list - "1,832 registered" on its own would be misleading next
        // to a filtered table.
        const total = allVehicles.length;
        document.getElementById("summary-count").textContent =
          rows.length === total
            ? `${total} vehicle${total === 1 ? "" : "s"} registered across all operators`
            : `${rows.length} of ${total} vehicles shown`;

        const host = document.getElementById("vehicle-list");

        if (rows.length === 0) {
          host.innerHTML = `<p class="empty">${
            allVehicles.length === 0 ? "No vehicles registered yet." : "No matches."
          }</p>`;
          return;
        }

        host.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  ${sortTh("Plate No.", "plate_no")}${sortTh("Operator", "operator")}
                  <th data-col="status">Status</th>
                  ${sortTh("Route", "route")}
                  <th data-col="origin">Origin</th><th data-col="destination">Destination</th>
                  <th data-col="case_number">Case No.</th>
                  <th data-col="mv_file_number">MV File #</th>
                  <th data-col="chassis_no">Chassis No.</th><th data-col="franchise">Franchise</th><th data-col="sticker_no">Sticker No.</th>
                  ${sortTh("CPC validity", "cpc_validity")}<th data-col="cpc_eov">CPC EOV?</th><th data-col="cpc_eov_validity">EOV validity</th>
                  ${sortTh("OR/CR validity", "orcr_validity")}
                  <th data-col="body_number">Body Number</th><th data-col="trade_name">Trade Name</th><th data-col="vehicle_year">Year</th><th data-col="vehicle_make">Make</th>
                  <th data-col="bus_type">Bus Type</th><th data-col="seating_capacity">Seating</th>
                  <th data-col="seat_type">Seat configuration</th><th data-col="remarks">Remarks</th>
                  <th data-col="rejection_reason">Note</th>
                  <th data-col="documents">Documents</th>
                </tr>
              </thead>
              <tbody>
                ${rows
                  .map((v) => {
                    const operatorLabel =
                      v.profiles?.operator_name || v.profiles?.username || "—";
                    return `
                  <tr class="row-clickable" data-vehicle-id="${escapeHtml(v.id)}">
                    <td class="cell-strong" data-label="Plate No." data-col="plate_no">${escapeHtml(v.plate_no)}</td>
                    <td data-label="Operator" data-col="operator">${escapeHtml(operatorLabel)}</td>
                    <td data-label="Status" data-col="status">${statusBadge(v.status)}</td>
                    <td data-label="Route" data-col="route">${escapeHtml(v.route ?? "—")}</td>
                    <td data-label="Origin" data-col="origin">${escapeHtml(v.origin ?? "—")}</td>
                    <td data-label="Destination" data-col="destination">${escapeHtml(v.destination ?? "—")}</td>
                    <td data-label="Case No." data-col="case_number">${escapeHtml(v.case_number ?? "—")}</td>
                    <td data-label="MV File #" data-col="mv_file_number">${escapeHtml(v.mv_file_number ?? "—")}</td>
                    <td data-label="Chassis No." data-col="chassis_no">${escapeHtml(v.chassis_no ?? "—")}</td>
                    <td data-label="Franchise" data-col="franchise">${escapeHtml(v.franchise ?? "—")}</td>
                    <td data-label="Sticker No." data-col="sticker_no">${escapeHtml(v.sticker_no ?? "—")}</td>
                    <td data-label="CPC validity" data-col="cpc_validity">${expiryCell(v.cpc_validity, escapeHtml)}</td>
                    <td data-label="CPC EOV?" data-col="cpc_eov">${v.cpc_eov ? "Yes" : "No"}</td>
                    <td data-label="EOV validity" data-col="cpc_eov_validity">${v.cpc_eov ? expiryCell(v.cpc_eov_validity, escapeHtml) : "—"}</td>
                    <td data-label="OR/CR validity" data-col="orcr_validity">${expiryCell(v.orcr_validity, escapeHtml)}</td>
                    <td data-label="Body Number" data-col="body_number">${escapeHtml(v.body_number ?? "—")}</td>
                    <td data-label="Trade Name" data-col="trade_name">${escapeHtml(v.trade_name ?? "—")}</td>
                    <td data-label="Year" data-col="vehicle_year">${escapeHtml(v.vehicle_year ?? "—")}</td>
                    <td data-label="Make" data-col="vehicle_make">${escapeHtml(v.vehicle_make ?? "—")}</td>
                    <td data-label="Bus Type" data-col="bus_type">${busTypeLabel(v.bus_type)}</td>
                    <td data-label="Seating" data-col="seating_capacity">${v.seating_capacity ?? "—"}</td>
                    <td data-label="Seat configuration" data-col="seat_type">${escapeHtml(v.seat_type ?? "—")}</td>
                    <td data-label="Remarks" data-col="remarks">${escapeHtml(v.remarks ?? "—")}</td>
                    <td data-label="Note" data-col="rejection_reason">${escapeHtml(v.rejection_reason ?? "—")}</td>
                    <td data-label="Documents" data-col="documents" data-vehicle-docs="${escapeHtml(v.id)}">&hellip;</td>
                  </tr>`;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        resolveDocLinks(rows);
        applyColumnVisibility();

        host.querySelectorAll("[data-sort]").forEach((th) => {
          th.addEventListener("click", () => {
            const key = th.dataset.sort;
            sortDir = sortKey === key && sortDir === "asc" ? "desc" : "asc";
            sortKey = key;
            render();
          });
        });

        // Anything but the row itself (e.g. a Documents link) should do
        // its own thing rather than also popping the details dialog.
        host.querySelectorAll("[data-vehicle-id]").forEach((tr) => {
          tr.addEventListener("click", (e) => {
            if (e.target.closest("a")) return;
            openDetails(tr.dataset.vehicleId);
          });
        });
      }

      // Signed URLs are resolved after the table paints (rather than
      // blocking the initial render on every row's storage round-trip),
      // same reasoning as the other pages that link into vehicle-docs.
      async function resolveDocLinks(rows) {
        await Promise.all(
          rows.map(async (v) => {
            const cell = document.querySelector(`[data-vehicle-docs="${v.id}"]`);
            if (!cell) return;

            const links = [];
            if (v.photo_path) {
              const { data } = await supabase.storage
                .from("vehicle-docs")
                .createSignedUrl(v.photo_path, 300);
              if (data?.signedUrl) {
                links.push(
                  `<a href="${data.signedUrl}" target="_blank" rel="noopener">OR/CR photo</a>`
                );
              }
            }
            if (v.supporting_doc_path) {
              const { data } = await supabase.storage
                .from("vehicle-docs")
                .createSignedUrl(v.supporting_doc_path, 300);
              if (data?.signedUrl) {
                links.push(
                  `<a href="${data.signedUrl}" target="_blank" rel="noopener">${escapeHtml(
                    v.supporting_doc_name || "Supporting doc"
                  )}</a>`
                );
              }
            }
            cell.innerHTML = links.length ? links.join("<br />") : "—";
          })
        );
      }
    </script>
  </body>
</html>
