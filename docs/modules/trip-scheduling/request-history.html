<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History · PITX Trip Scheduling</title>
    <!-- See dashboard.html's comment - same reasoning, kept as a redirect
         rather than deleted so old links still land somewhere real. -->
    <meta http-equiv="refresh" content="0; url=operator-overview.html?tab=history" />
  </head>
  <body>
    <script>
      // A deep link into a specific month (request-history.html?month=YYYY-MM)
      // still worked before this became a tab - forward it along rather
      // than dropping it, since the History tab reads the same "month"
      // query param on load.
      const month = new URLSearchParams(location.search).get("month");
      location.replace(
        "operator-overview.html?tab=history" + (month ? "&month=" + encodeURIComponent(month) : "")
      );
    </script>
    <p>Redirecting to <a href="operator-overview.html?tab=history">History</a>…</p>
  </body>
</html>
