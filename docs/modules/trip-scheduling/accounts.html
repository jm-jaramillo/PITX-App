<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accounts · PITX Trip Scheduling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="nav"></aside>
      <div class="app-content">
        <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Access Control</p>
          <h1>Accounts</h1>
          <p class="subtle">
            Create login accounts for bus operators and other PITX staff.
            There is no self-signup.
          </p>
        </div>
      </div>

      <div class="hidden" id="message"></div>

      <form class="card grid grid-2" id="create-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" required />
        </div>

        <div class="field">
          <label for="password">Temporary password</label>
          <input id="password" name="password" type="text" minlength="8" required />
        </div>

        <div class="field">
          <label for="role">Role</label>
          <select id="role" name="role" required>
            <option value="operator" selected>Bus operator</option>
            <option value="staff">PITX staff</option>
            <option value="ticketing">Ticketing Admin</option>
          </select>
        </div>

        <div class="field">
          <label for="operator_name">Operator / display name (optional)</label>
          <input
            id="operator_name"
            name="operator_name"
            placeholder="e.g. Genesis Transport"
          />
        </div>

        <div class="span-all">
          <button type="submit" class="btn-primary" id="submit">
            Create account
          </button>
        </div>
      </form>

      <h2>Existing accounts</h2>
      <div class="field" style="max-width: 360px">
        <label for="search">Search</label>
        <input id="search" placeholder="Username or operator name…" />
      </div>
      <div id="list"></div>
    </main>
      </div>
    </div>
      </div>
    </div>

    <script type="module">
      import {
        supabase,
        onLiveChange,
        guardPage,
        renderNav,
        showMessage,
        escapeHtml,
        fetchAllRows,
        toast,
      } from "./assets/app.js";
      import { SUPABASE_URL } from "../../shared/config.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      let allProfiles = [];

      document
        .getElementById("create-form")
        .addEventListener("submit", createAccount);
      document.getElementById("search").addEventListener("input", render);
      await load();
      onLiveChange(["profiles"], load);
      highlightFromQuery();

      // A password-reset-request notification (see the Edge Function
      // request-password-reset) links here as accounts.html?user=<id> -
      // scroll to and highlight that row, same pattern
      // applyVehicleHighlightFromQuery() uses on the vehicle pages, so
      // staff land on the exact account rather than just the page.
      function highlightFromQuery() {
        const userId = new URLSearchParams(location.search).get("user");
        if (!userId) return;
        const row = document.querySelector(`[data-row-id="${CSS.escape(userId)}"]`);
        if (!row) return;
        row.classList.add("row-highlighted");
        row.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      async function load() {
        const { data } = await fetchAllRows((from, to) =>
          supabase
            .from("profiles")
            .select("id, username, role, operator_name, created_at")
            .order("created_at", { ascending: false })
            .range(from, to)
        );

        allProfiles = data ?? [];
        render();
      }

      function render() {
        const query = document.getElementById("search").value.trim().toLowerCase();
        const profiles = query
          ? allProfiles.filter((p) =>
              [p.username, p.operator_name]
                .filter(Boolean)
                .some((v) => v.toLowerCase().includes(query))
            )
          : allProfiles;

        document.getElementById("list").innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Username</th><th>Role</th><th>Operator name</th><th>Created</th><th></th>
                </tr>
              </thead>
              <tbody>
                ${profiles
                  .map(
                    (p) => `
                  <tr data-row-id="${escapeHtml(p.id)}">
                    <td data-label="Username">${escapeHtml(p.username)}</td>
                    <td data-label="Role" style="text-transform: capitalize">${escapeHtml(p.role)}</td>
                    <td data-label="Operator name">${escapeHtml(p.operator_name ?? "—")}</td>
                    <td data-label="Created">${escapeHtml(
                      new Date(p.created_at).toLocaleDateString()
                    )}</td>
                    <td><div class="row-actions">
                      <button type="button" class="btn-link" data-reset="${escapeHtml(
                        p.id
                      )}" data-username="${escapeHtml(p.username)}">Reset password</button>
                      ${
                        p.role === "operator"
                          ? `<button type="button" class="btn-link" data-merge="${escapeHtml(
                              p.id
                            )}">Merge into…</button>
                            <button type="button" class="btn-link" data-split="${escapeHtml(
                              p.id
                            )}">Split trade…</button>`
                          : ""
                      }
                      ${
                        p.id === profile.id
                          ? ""
                          : `<button type="button" class="btn-link danger" data-delete="${escapeHtml(
                              p.id
                            )}" data-username="${escapeHtml(p.username)}">Delete</button>`
                      }
                    </div></td>
                  </tr>`
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById("list").querySelectorAll("[data-delete]").forEach((btn) => {
          btn.addEventListener("click", () =>
            deleteAccount(btn.dataset.delete, btn.dataset.username)
          );
        });
        document.getElementById("list").querySelectorAll("[data-merge]").forEach((btn) => {
          btn.addEventListener("click", () => mergeAccount(btn.dataset.merge));
        });
        document.getElementById("list").querySelectorAll("[data-split]").forEach((btn) => {
          btn.addEventListener("click", () => splitTrade(btn.dataset.split));
        });
        document.getElementById("list").querySelectorAll("[data-reset]").forEach((btn) => {
          btn.addEventListener("click", () =>
            resetPassword(btn.dataset.reset, btn.dataset.username)
          );
        });
      }

      // No self-service "forgot password" exists (no self-signup either -
      // see the page intro) - this is the only way an operator or staff
      // account recovers a lost password, previously only possible by
      // deleting and recreating the account outright, which loses nothing
      // structurally (bookings/vehicles key off the same id) but is a much
      // blunter tool than it needs to be for "I forgot my password."
      async function resetPassword(userId, username) {
        const newPassword = prompt(
          `New temporary password for "${username}" (at least 8 characters):`
        );
        if (newPassword === null) return; // cancelled
        if (newPassword.length < 8) {
          showMessage("message", "New password must be at least 8 characters.");
          return;
        }

        showMessage("message", "");

        // Same reasoning as create/delete-account: needs the service_role
        // key, which never reaches this public page - runs in the
        // `reset-password` Edge Function instead.
        const { data: sessionData } = await supabase.auth.getSession();
        const accessToken = sessionData?.session?.access_token;

        let result;
        try {
          const response = await fetch(
            `${SUPABASE_URL}/functions/v1/reset-password`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ user_id: userId, new_password: newPassword }),
            }
          );
          result = await response.json();
        } catch {
          result = {
            error:
              "Could not reach the password-reset service. Is the " +
              "`reset-password` Edge Function deployed?",
          };
        }

        if (result?.error) {
          showMessage("message", result.error);
          return;
        }

        showMessage("message", `Password for "${result.username}" reset.`, "ok");
      }

      // Some operators hold several lines/trades under separate accounts but
      // one person runs the fleet. Merging moves the chosen account's
      // vehicles, trips, transfers and notifications into another operator
      // account (staff_merge_operators, migration 202611191000), then
      // optionally deletes the now-empty account through the same
      // delete-account Edge Function the Delete button uses.
      function mergeAccount(sourceId) {
        const source = allProfiles.find((p) => p.id === sourceId);
        const label = (p) =>
          p.operator_name ? `${p.operator_name} (${p.username})` : p.username;
        const targets = allProfiles
          .filter((p) => p.role === "operator" && p.id !== sourceId)
          .sort((a, b) => label(a).localeCompare(label(b)));
        if (!source || !targets.length) {
          showMessage("message", "There is no other operator account to merge into.");
          return;
        }

        const dlg = document.createElement("dialog");
        dlg.className = "ask-dialog";
        dlg.innerHTML = `
          <h2 class="dialog-title">Merge operator account</h2>
          <p class="subtle">
            Move everything owned by <strong>${escapeHtml(label(source))}</strong>
            (vehicles, trips, transfers, notifications) into the account below.
            The company profile of the account you keep is retained.
          </p>
          <div class="field">
            <label for="merge-target">Merge into (the account to keep)</label>
            <select id="merge-target">
              <option value="">Select an operator account…</option>
              ${targets
                .map((t) => `<option value="${escapeHtml(t.id)}">${escapeHtml(label(t))}</option>`)
                .join("")}
            </select>
          </div>
          <p class="subtle" id="merge-preview" aria-live="polite"></p>
          <label style="display:flex;gap:8px;align-items:center;margin-top:8px">
            <input type="checkbox" id="merge-delete" checked />
            Delete the empty "${escapeHtml(source.username)}" account afterwards
          </label>
          <div class="dialog-actions">
            <button type="button" class="btn-outline" data-act="cancel">Cancel</button>
            <button type="button" class="btn-primary" data-act="ok" disabled>Merge accounts</button>
          </div>`;
        document.body.appendChild(dlg);
        const sel = dlg.querySelector("#merge-target");
        const prev = dlg.querySelector("#merge-preview");
        const ok = dlg.querySelector("[data-act=ok]");
        dlg.addEventListener("close", () => dlg.remove());

        sel.addEventListener("change", async () => {
          ok.disabled = true;
          prev.textContent = "";
          if (!sel.value) return;
          prev.textContent = "Checking…";
          const { data, error } = await supabase.rpc("staff_merge_operators_preview", {
            p_source: sourceId,
            p_target: sel.value,
          });
          if (error) {
            prev.textContent = error.message;
            return;
          }
          const dups = data.duplicate_plates ?? [];
          if (dups.length) {
            prev.textContent =
              `Can't merge: both accounts have a vehicle with the same plate (${dups.join(", ")}). ` +
              `Remove the duplicate from one account first.`;
            return;
          }
          prev.textContent =
            `${data.vehicles} vehicle(s) and ${data.bookings} trip(s) will move to ${data.target}. ` +
            `This can't be undone.`;
          ok.disabled = false;
        });

        dlg.addEventListener("click", async (e) => {
          const act = e.target.closest?.("[data-act]")?.dataset.act;
          if (act === "cancel" || e.target === dlg) return dlg.close();
          if (act !== "ok") return;
          ok.disabled = true;
          ok.textContent = "Merging…";
          const { data, error } = await supabase.rpc("staff_merge_operators", {
            p_source: sourceId,
            p_target: sel.value,
          });
          if (error) {
            prev.textContent = error.message;
            ok.textContent = "Merge accounts";
            return;
          }
          const wantDelete = dlg.querySelector("#merge-delete").checked;
          dlg.close();
          let note = "";
          let failed = false;
          if (wantDelete) {
            const err = await deleteAccountQuietly(sourceId);
            failed = !!err;
            note = err
              ? ` The old account couldn't be deleted (${err}); delete it manually.`
              : " The old account was deleted.";
          }
          toast(
            `Merged ${data.source} into ${data.target}: ${data.vehicles} vehicle(s), ${data.bookings} trip(s).${note}`,
            { kind: failed ? "error" : "ok", ms: 9000 }
          );
          await load();
        });

        dlg.showModal();
        sel.focus();
      }

      // Reverse of a merge: one account runs several trades (vehicles.trade_name);
      // split the chosen trade(s) - vehicles plus their trips - into a brand-new
      // operator account (staff_split_operator_trade, migration 202611191100).
      async function splitTrade(sourceId) {
        const source = allProfiles.find((p) => p.id === sourceId);
        const { data: vehicles, error: vErr } = await supabase
          .from("vehicles")
          .select("plate_no, trade_name")
          .eq("operator_id", sourceId);
        if (vErr) {
          showMessage("message", vErr.message);
          return;
        }
        const trades = new Map();
        for (const v of vehicles ?? []) {
          const t = (v.trade_name ?? "").trim();
          if (t) trades.set(t, (trades.get(t) ?? 0) + 1);
        }
        if (!trades.size) {
          showMessage(
            "message",
            `"${source.username}" has no vehicles with a trade name, so there is nothing to split. ` +
              `Set trade names on its vehicles first.`
          );
          return;
        }

        const dlg = document.createElement("dialog");
        dlg.className = "ask-dialog";
        dlg.innerHTML = `
          <h2 class="dialog-title">Split a trade into its own account</h2>
          <p class="subtle">
            Tick the trade(s) of <strong>${escapeHtml(source.operator_name ?? source.username)}</strong>
            to move, with their vehicles and trips, into a new operator account.
          </p>
          <fieldset style="border:0;padding:0;margin:0 0 8px">
            ${[...trades]
              .map(
                ([name, n]) => `<label style="display:flex;gap:8px;align-items:center;margin:4px 0">
                  <input type="checkbox" name="trade" value="${escapeHtml(name)}" />
                  ${escapeHtml(name)} <span class="subtle">(${n} vehicle${n === 1 ? "" : "s"})</span>
                </label>`
              )
              .join("")}
          </fieldset>
          <div class="field"><label for="split-username">New username</label>
            <input id="split-username" /></div>
          <div class="field"><label for="split-password">Temporary password</label>
            <input id="split-password" type="text" minlength="8" /></div>
          <div class="field"><label for="split-name">Display name</label>
            <input id="split-name" placeholder="Defaults to the trade name" /></div>
          <p class="subtle" id="split-msg" aria-live="polite"></p>
          <div class="dialog-actions">
            <button type="button" class="btn-outline" data-act="cancel">Cancel</button>
            <button type="button" class="btn-primary" data-act="ok">Create account &amp; split</button>
          </div>`;
        document.body.appendChild(dlg);
        const msg = dlg.querySelector("#split-msg");
        const ok = dlg.querySelector("[data-act=ok]");
        dlg.addEventListener("close", () => dlg.remove());

        dlg.addEventListener("click", async (e) => {
          const act = e.target.closest?.("[data-act]")?.dataset.act;
          if (act === "cancel" || e.target === dlg) return dlg.close();
          if (act !== "ok") return;

          const picked = [...dlg.querySelectorAll("[name=trade]:checked")].map((c) => c.value);
          const username = dlg.querySelector("#split-username").value.trim();
          const password = dlg.querySelector("#split-password").value;
          const name = dlg.querySelector("#split-name").value.trim() || picked.join(" / ");
          if (!picked.length) return void (msg.textContent = "Tick at least one trade.");
          if (!username) return void (msg.textContent = "Enter a username for the new account.");
          if (password.length < 8)
            return void (msg.textContent = "Password must be at least 8 characters.");

          ok.disabled = true;
          msg.textContent = "Creating account…";
          const { data: sessionData } = await supabase.auth.getSession();
          let created;
          try {
            const response = await fetch(`${SUPABASE_URL}/functions/v1/create-account`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${sessionData?.session?.access_token}`,
              },
              body: JSON.stringify({ username, password, role: "operator", operator_name: name }),
            });
            created = await response.json();
          } catch {
            created = { error: "Could not reach the account-creation service." };
          }
          if (created?.error) {
            msg.textContent = created.error;
            ok.disabled = false;
            return;
          }

          const { data: newProfile } = await supabase
            .from("profiles")
            .select("id")
            .ilike("username", created.username)
            .maybeSingle();
          msg.textContent = "Moving vehicles and trips…";
          const { data, error } = newProfile
            ? await supabase.rpc("staff_split_operator_trade", {
                p_source: sourceId,
                p_target: newProfile.id,
                p_trade_names: picked,
              })
            : { error: { message: "New account not found." } };
          if (error) {
            msg.textContent =
              `Account "${created.username}" was created but the split failed: ${error.message}. ` +
              `Delete that account or try again with it as the target.`;
            ok.disabled = false;
            await load();
            return;
          }
          dlg.close();
          toast(
            `Split ${picked.join(", ")} into "${created.username}": ${data.vehicles} vehicle(s), ${data.bookings} trip(s).`,
            { ms: 9000 }
          );
          await load();
        });

        dlg.showModal();
        dlg.querySelector("[name=trade]").focus();
      }

      async function deleteAccountQuietly(userId) {
        const { data: sessionData } = await supabase.auth.getSession();
        try {
          const response = await fetch(`${SUPABASE_URL}/functions/v1/delete-account`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${sessionData?.session?.access_token}`,
            },
            body: JSON.stringify({ user_id: userId }),
          });
          const result = await response.json();
          return result?.error ?? null;
        } catch {
          return "delete-account service unreachable";
        }
      }

      async function deleteAccount(userId, username) {
        if (
          !confirm(
            `Delete the account "${username}"? This can't be undone. It'll fail ` +
              `instead if that account still has bookings, vehicles, or approval ` +
              `decisions on record.`
          )
        ) {
          return;
        }

        showMessage("message", "");

        // Same reasoning as account creation: needs the service_role key,
        // which never reaches this public page - runs in the
        // `delete-account` Edge Function instead.
        const { data: sessionData } = await supabase.auth.getSession();
        const accessToken = sessionData?.session?.access_token;

        let result;
        try {
          const response = await fetch(
            `${SUPABASE_URL}/functions/v1/delete-account`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ user_id: userId }),
            }
          );
          result = await response.json();
        } catch {
          result = {
            error:
              "Could not reach the account-deletion service. Is the " +
              "`delete-account` Edge Function deployed?",
          };
        }

        if (result?.error) {
          showMessage("message", result.error);
          return;
        }

        showMessage("message", `Account "${result.username}" deleted.`, "ok");
        await load();
      }

      async function createAccount(event) {
        event.preventDefault();
        showMessage("message", "");

        const submitBtn = document.getElementById("submit");
        submitBtn.disabled = true;
        submitBtn.textContent = "Creating…";

        // Account creation needs the service_role key, which can never live
        // in this public page - so it runs in the `create-account` Edge
        // Function, which re-verifies that we're staff before doing anything.
        const { data: sessionData } = await supabase.auth.getSession();
        const accessToken = sessionData?.session?.access_token;

        let result;
        try {
          const response = await fetch(
            `${SUPABASE_URL}/functions/v1/create-account`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
                role: document.getElementById("role").value,
                operator_name: document.getElementById("operator_name").value,
              }),
            }
          );
          result = await response.json();
        } catch {
          result = {
            error:
              "Could not reach the account-creation service. Is the " +
              "`create-account` Edge Function deployed?",
          };
        }

        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";

        if (result?.error) {
          showMessage("message", result.error);
          return;
        }

        showMessage("message", `Account "${result.username}" created.`, "ok");
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("operator_name").value = "";
        await load();
      }
    </script>
  </body>
</html>
