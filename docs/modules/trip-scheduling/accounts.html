<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accounts · PITX Trip Scheduling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="nav"></aside>
      <div class="app-content">
        <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Access Control</p>
          <h1>Accounts</h1>
          <p class="subtle">
            Create login accounts for bus operators and other PITX staff.
            There is no self-signup.
          </p>
        </div>
      </div>

      <div class="hidden" id="message"></div>

      <form class="card grid grid-2" id="create-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" required />
        </div>

        <div class="field">
          <label for="password">Temporary password</label>
          <input id="password" name="password" type="text" minlength="8" required />
        </div>

        <div class="field">
          <label for="role">Role</label>
          <select id="role" name="role" required>
            <option value="operator" selected>Bus operator</option>
            <option value="staff">PITX staff</option>
            <option value="ticketing">Ticketing Admin</option>
          </select>
        </div>

        <div class="field">
          <label for="operator_name">Operator / display name (optional)</label>
          <input
            id="operator_name"
            name="operator_name"
            placeholder="e.g. Genesis Transport"
          />
        </div>

        <div class="span-all">
          <button type="submit" class="btn-primary" id="submit">
            Create account
          </button>
        </div>
      </form>

      <h2>Existing accounts</h2>
      <div class="field" style="max-width: 360px">
        <label for="search">Search</label>
        <input id="search" placeholder="Username or operator name…" />
      </div>
      <div id="list"></div>
    </main>
      </div>
    </div>
      </div>
    </div>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        showMessage,
        escapeHtml,
        fetchAllRows,
      } from "./assets/app.js";
      import { SUPABASE_URL } from "../../shared/config.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      let allProfiles = [];

      document
        .getElementById("create-form")
        .addEventListener("submit", createAccount);
      document.getElementById("search").addEventListener("input", render);
      await load();
      highlightFromQuery();

      // A password-reset-request notification (see the Edge Function
      // request-password-reset) links here as accounts.html?user=<id> -
      // scroll to and highlight that row, same pattern
      // applyVehicleHighlightFromQuery() uses on the vehicle pages, so
      // staff land on the exact account rather than just the page.
      function highlightFromQuery() {
        const userId = new URLSearchParams(location.search).get("user");
        if (!userId) return;
        const row = document.querySelector(`[data-row-id="${CSS.escape(userId)}"]`);
        if (!row) return;
        row.classList.add("row-highlighted");
        row.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      async function load() {
        const { data } = await fetchAllRows((from, to) =>
          supabase
            .from("profiles")
            .select("id, username, role, operator_name, created_at")
            .order("created_at", { ascending: false })
            .range(from, to)
        );

        allProfiles = data ?? [];
        render();
      }

      function render() {
        const query = document.getElementById("search").value.trim().toLowerCase();
        const profiles = query
          ? allProfiles.filter((p) =>
              [p.username, p.operator_name]
                .filter(Boolean)
                .some((v) => v.toLowerCase().includes(query))
            )
          : allProfiles;

        document.getElementById("list").innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Username</th><th>Role</th><th>Operator name</th><th>Created</th><th></th>
                </tr>
              </thead>
              <tbody>
                ${profiles
                  .map(
                    (p) => `
                  <tr data-row-id="${escapeHtml(p.id)}">
                    <td data-label="Username">${escapeHtml(p.username)}</td>
                    <td data-label="Role" style="text-transform: capitalize">${escapeHtml(p.role)}</td>
                    <td data-label="Operator name">${escapeHtml(p.operator_name ?? "—")}</td>
                    <td data-label="Created">${escapeHtml(
                      new Date(p.created_at).toLocaleDateString()
                    )}</td>
                    <td><div class="row-actions">
                      <button type="button" class="btn-link" data-reset="${escapeHtml(
                        p.id
                      )}" data-username="${escapeHtml(p.username)}">Reset password</button>
                      ${
                        p.id === profile.id
                          ? ""
                          : `<button type="button" class="btn-link danger" data-delete="${escapeHtml(
                              p.id
                            )}" data-username="${escapeHtml(p.username)}">Delete</button>`
                      }
                    </div></td>
                  </tr>`
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById("list").querySelectorAll("[data-delete]").forEach((btn) => {
          btn.addEventListener("click", () =>
            deleteAccount(btn.dataset.delete, btn.dataset.username)
          );
        });
        document.getElementById("list").querySelectorAll("[data-reset]").forEach((btn) => {
          btn.addEventListener("click", () =>
            resetPassword(btn.dataset.reset, btn.dataset.username)
          );
        });
      }

      // No self-service "forgot password" exists (no self-signup either -
      // see the page intro) - this is the only way an operator or staff
      // account recovers a lost password, previously only possible by
      // deleting and recreating the account outright, which loses nothing
      // structurally (bookings/vehicles key off the same id) but is a much
      // blunter tool than it needs to be for "I forgot my password."
      async function resetPassword(userId, username) {
        const newPassword = prompt(
          `New temporary password for "${username}" (at least 8 characters):`
        );
        if (newPassword === null) return; // cancelled
        if (newPassword.length < 8) {
          showMessage("message", "New password must be at least 8 characters.");
          return;
        }

        showMessage("message", "");

        // Same reasoning as create/delete-account: needs the service_role
        // key, which never reaches this public page - runs in the
        // `reset-password` Edge Function instead.
        const { data: sessionData } = await supabase.auth.getSession();
        const accessToken = sessionData?.session?.access_token;

        let result;
        try {
          const response = await fetch(
            `${SUPABASE_URL}/functions/v1/reset-password`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ user_id: userId, new_password: newPassword }),
            }
          );
          result = await response.json();
        } catch {
          result = {
            error:
              "Could not reach the password-reset service. Is the " +
              "`reset-password` Edge Function deployed?",
          };
        }

        if (result?.error) {
          showMessage("message", result.error);
          return;
        }

        showMessage("message", `Password for "${result.username}" reset.`, "ok");
      }

      async function deleteAccount(userId, username) {
        if (
          !confirm(
            `Delete the account "${username}"? This can't be undone. It'll fail ` +
              `instead if that account still has bookings, vehicles, or approval ` +
              `decisions on record.`
          )
        ) {
          return;
        }

        showMessage("message", "");

        // Same reasoning as account creation: needs the service_role key,
        // which never reaches this public page - runs in the
        // `delete-account` Edge Function instead.
        const { data: sessionData } = await supabase.auth.getSession();
        const accessToken = sessionData?.session?.access_token;

        let result;
        try {
          const response = await fetch(
            `${SUPABASE_URL}/functions/v1/delete-account`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ user_id: userId }),
            }
          );
          result = await response.json();
        } catch {
          result = {
            error:
              "Could not reach the account-deletion service. Is the " +
              "`delete-account` Edge Function deployed?",
          };
        }

        if (result?.error) {
          showMessage("message", result.error);
          return;
        }

        showMessage("message", `Account "${result.username}" deleted.`, "ok");
        await load();
      }

      async function createAccount(event) {
        event.preventDefault();
        showMessage("message", "");

        const submitBtn = document.getElementById("submit");
        submitBtn.disabled = true;
        submitBtn.textContent = "Creating…";

        // Account creation needs the service_role key, which can never live
        // in this public page - so it runs in the `create-account` Edge
        // Function, which re-verifies that we're staff before doing anything.
        const { data: sessionData } = await supabase.auth.getSession();
        const accessToken = sessionData?.session?.access_token;

        let result;
        try {
          const response = await fetch(
            `${SUPABASE_URL}/functions/v1/create-account`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
                role: document.getElementById("role").value,
                operator_name: document.getElementById("operator_name").value,
              }),
            }
          );
          result = await response.json();
        } catch {
          result = {
            error:
              "Could not reach the account-creation service. Is the " +
              "`create-account` Edge Function deployed?",
          };
        }

        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";

        if (result?.error) {
          showMessage("message", result.error);
          return;
        }

        showMessage("message", `Account "${result.username}" created.`, "ok");
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("operator_name").value = "";
        await load();
      }
    </script>
  </body>
</html>
