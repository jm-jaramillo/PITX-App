<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schedule · PITX Trip Scheduling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <style>
      /* Airport-style Public Information Display board. Dark bars for
         the column header and each time-group divider (matching the
         app's own dark nav bar, not the maroon spreadsheet look this
         was modeled on), tabular-nums throughout since trip numbers,
         plate numbers, and bay numbers all read as columns of digits. */
      .pids-wrap {
        border-radius: var(--r-card, 20px);
        overflow: hidden;
        border: 1px solid var(--border, #d7dbe3);
        background: var(--surface, #fff);
      }

      .pids-table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }

      .pids-table thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--bar, #14192b);
        color: var(--bar-text, #c7ccdc);
        font-family: var(--display, inherit);
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: left;
        padding: 12px 14px;
        white-space: nowrap;
      }
      .pids-table thead th.pids-num {
        text-align: center;
      }

      .pids-time-row td {
        background: var(--blue-wash, #eef1fb);
        color: var(--blue-ink, #1d2b6b);
        font-family: var(--display, inherit);
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 0.02em;
        padding: 9px 14px;
        position: sticky;
        top: 38px;
        z-index: 1;
      }

      .pids-row td {
        padding: 10px 14px;
        border-bottom: 1px solid var(--divider, #eef0f3);
        font-size: 13.5px;
        vertical-align: middle;
      }
      .pids-row:hover td {
        background: var(--ground, #f7f8fa);
      }
      .pids-row.is-cancelled td {
        color: var(--faint, #9aa1b2);
      }
      .pids-row.is-cancelled .pids-company-name,
      .pids-row.is-cancelled .pids-trip-no {
        text-decoration: line-through;
      }

      .pids-company {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .pids-avatar {
        flex-shrink: 0;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--display, inherit);
        font-weight: 800;
        font-size: 12px;
        color: #fff;
      }
      .pids-company-name {
        font-weight: 700;
        color: var(--title, #14192b);
        line-height: 1.3;
      }

      .pids-trip-no {
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .pids-num {
        text-align: center;
        font-weight: 700;
      }

      .pids-status {
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .pids-status.status-arriving {
        color: var(--green-ink, #1c6b3f);
      }
      .pids-status.status-departed {
        color: var(--faint, #9aa1b2);
      }
      .pids-status.status-cancelled {
        color: var(--red-ink, #9c1f22);
      }

      .pids-bay-reassign select {
        font-size: 12px;
        padding: 2px 4px;
        border-radius: 6px;
        border: 1px solid var(--border, #d7dbe3);
        max-width: 88px;
      }

      /* An approved trip with no plate assigned yet - operationally the
         thing staff most need to spot on the board, since the trip can't
         be matched to an actual bus at the gate. Rendered as an explicit
         marker rather than an empty cell, which read as "nothing here". */
      .pids-no-plate {
        color: var(--red-ink, #9c1f22);
        font-weight: 700;
        font-size: 12px;
      }

      .pids-empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--faint, #9aa1b2);
        font-size: 13.5px;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="nav"></aside>
      <div class="app-content">
        <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Trip Monitor</p>
          <h1>Schedule</h1>
          <p class="subtle" id="capacity-note"></p>
        </div>
        <div class="toolbar">
          <div class="mode-switch" role="tablist" id="range-mode">
            <button type="button" class="mode-tab is-active" data-range="day">Day</button>
            <button type="button" class="mode-tab" data-range="week">Week</button>
          </div>
          <button type="button" class="btn-outline" id="prev">&larr; Prev day</button>
          <input type="date" id="date" />
          <button type="button" class="btn-outline" id="next">Next day &rarr;</button>
          <details class="row-menu"><summary class="menu-btn" aria-label="More">&#8943;</summary><div class="row-menu-pop"><button type="button" class="btn-link" id="export-csv">Export CSV</button></div></details>
        </div>
      </div>

      <div class="field" style="max-width: 380px; margin: 4px 0 14px">
        <label for="board-search">Filter</label>
        <input id="board-search" placeholder="Operator, destination, plate, or trip no.…" />
      </div>

      <div class="hidden" id="message"></div>
      <div id="grid"></div>

      <dialog id="trip-dialog" class="card" style="max-width: 440px; width: calc(100% - 32px)">
        <form id="trip-form" method="dialog">
          <h2 style="margin-top: 0">Plate &amp; operator</h2>
          <p class="subtle" id="trip-context"></p>
          <div class="field">
            <label for="trip-operator">Operator</label>
            <select id="trip-operator"></select>
          </div>
          <div class="field">
            <label for="trip-plate">Plate number</label>
            <select id="trip-plate"></select>
          </div>
          <p class="subtle" id="trip-hint"></p>
          <div class="hidden" id="trip-message"></div>
          <div style="display: flex; gap: 8px; justify-content: flex-end">
            <button type="button" class="btn-outline" id="trip-cancel">Cancel</button>
            <button type="submit" class="btn-primary" id="trip-save">Save</button>
          </div>
        </form>
      </dialog>
    </main>
      </div>
    </div>
      </div>
    </div>

    <script type="module">
      import { renderWeek, weekStartISO, weekRangeLabel } from "./assets/week-view.js";
      import {
        supabase,
        guardPage,
        renderNav,
        formatSlotStart,
        todayISO,
        addDays,
        bookingOperatorHtml,
        gateForRoute,
        slotStartMillis,
        showMessage,
        escapeHtml,
        downloadCsv,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      const dateInput = document.getElementById("date");
      // Allow deep-linking to a specific day: schedule.html?date=YYYY-MM-DD
      const fromQuery = new URLSearchParams(location.search).get("date");
      let currentDate = /^\d{4}-\d{2}-\d{2}$/.test(fromQuery ?? "")
        ? fromQuery
        : todayISO();
      dateInput.value = currentDate;

      // Day (the full departures board) or Week (a compact grid of operator +
      // trip code per day). ?view=week deep-links straight into the week.
      let rangeMode =
        new URLSearchParams(location.search).get("view") === "week" ? "week" : "day";
      const rangeStep = () => (rangeMode === "week" ? 7 : 1);
      const rangeFrom = () => (rangeMode === "week" ? weekStartISO(currentDate) : currentDate);
      const rangeTo = () => (rangeMode === "week" ? addDays(weekStartISO(currentDate), 6) : currentDate);

      function setRange(mode) {
        rangeMode = mode;
        document.querySelectorAll("#range-mode [data-range]").forEach((b) => {
          b.classList.toggle("is-active", b.dataset.range === mode);
        });
        document.getElementById("prev").innerHTML = mode === "week" ? "&larr; Prev week" : "&larr; Prev day";
        document.getElementById("next").innerHTML = mode === "week" ? "Next week &rarr;" : "Next day &rarr;";
        load();
      }
      document.querySelectorAll("#range-mode [data-range]").forEach((btn) => {
        btn.addEventListener("click", () => setRange(btn.dataset.range));
      });
      // ?view=week arrives already in week mode - sync the controls without
      // calling setRange(), which would load() before the board's helpers exist.
      if (rangeMode === "week") {
        document.querySelectorAll("#range-mode [data-range]").forEach((b) =>
          b.classList.toggle("is-active", b.dataset.range === "week")
        );
        document.getElementById("prev").innerHTML = "&larr; Prev week";
        document.getElementById("next").innerHTML = "Next week &rarr;";
      }

      // Retained from the most recent load() so the Export CSV button can
      // reuse the already-fetched bookings instead of refetching.
      let lastDayBookings = [];
      let activeBays = [];

      const BASE_CSV_HEADERS = [
        "Time",
        "Company",
        "Trip No.",
        "Plate No.",
        "Destination",
        "Gate",
        "Bay",
      ];

      const csvHeaders = () => (rangeMode === "week" ? ["Date", ...BASE_CSV_HEADERS] : BASE_CSV_HEADERS);
      const bookingToCsvRow = (b) =>
        rangeMode === "week" ? [b.booking_date, ...baseCsvRow(b)] : baseCsvRow(b);

      function baseCsvRow(b) {
        return [
          formatSlotStart(b.slot),
          b.operator_name ?? "",
          b.trip_number ?? "",
          b.plate_no ?? "",
          b.route ?? "",
          bareGate(b.route),
          bareBay(b.bays?.name),
        ];
      }

      function exportCsv() {
        // Matches what is on screen, filter included.
        const rows = lastDayBookings
          .filter(matchesBoardFilter)
          .sort((a, b) => (a.booking_date ?? "").localeCompare(b.booking_date ?? "") || a.slot - b.slot)
          .map(bookingToCsvRow);
        downloadCsv(`schedule-${rangeMode === "week" ? "week-" + weekStartISO(currentDate) : currentDate}.csv`, csvHeaders(), rows);
      }

      dateInput.addEventListener("change", () => {
        if (dateInput.value) {
          currentDate = dateInput.value;
          load();
        }
      });
      document.getElementById("prev").addEventListener("click", () => {
        currentDate = addDays(currentDate, -rangeStep());
        dateInput.value = currentDate;
        load();
      });
      document.getElementById("next").addEventListener("click", () => {
        currentDate = addDays(currentDate, rangeStep());
        dateInput.value = currentDate;
        load();
      });
      document.getElementById("export-csv").addEventListener("click", exportCsv);
      document.getElementById("board-search").addEventListener("input", renderBoard);

      // Strips the "Gate "/"Bay " prefix a PIDS board doesn't repeat on
      // every row (the column header already says what it is) - falls
      // back to the full string for anything that doesn't match, so an
      // unexpected naming scheme never silently disappears. Declared
      // (along with everything else below, down to pidsStatus) ahead of
      // the module's top-level `await load()` a few lines down - load()
      // -> renderBoard() reads these at module top-level, which would
      // otherwise run while these `const`s are still in their temporal
      // dead zone (same class of bug as #37/#39/#46/#52/#66/#69/#75).
      function bareNumber(prefix, value) {
        if (!value) return "—";
        const re = new RegExp(`^${prefix}\\s*`, "i");
        return value.replace(re, "");
      }
      const bareGate = (route) => bareNumber("Gate", gateForRoute(route));
      const bareBay = (bayName) => bareNumber("Bay", bayName);

      // A stable colour per operator (hashed from the name, not random)
      // so the same company always gets the same avatar colour across
      // reloads, without needing real logo artwork on file.
      const AVATAR_PALETTE = [
        "#2f5fd0", "#1c6b3f", "#9c1f22", "#a15c00",
        "#6b3fa0", "#0f7a8c", "#b0326b", "#4a5568",
      ];
      function avatarColor(name) {
        let hash = 0;
        for (const ch of name || "") hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
        return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
      }
      function initials(name) {
        const words = (name || "?").trim().split(/\s+/).filter(Boolean);
        return ((words[0]?.[0] ?? "") + (words[1]?.[0] ?? "")).toUpperCase() || "?";
      }

      // The board no longer shows a status (arrival/departure is the Terminal
      // Operating System's job). All that is left is whether a trip is
      // cancelled (struck through) and whether its slot has passed - staff can
      // only change the bay, plate or operator of a trip that hasn't departed.
      const isCancelled = (b) => b.status === "cancelled";
      const hasDeparted = (b) =>
        slotStartMillis(b.booking_date ?? currentDate, b.slot) + 15 * 60 * 1000 <= Date.now();

      // Approved trips link to the Terminal Operating System's Bay timeline,
      // which opens on that day with the trip selected (it reads ?date= and
      // ?trip=<booking id>). TOS only knows approved trips, so cancelled rows
      // keep the plain trip number.
      function tosTripLink(b) {
        const text = escapeHtml(b.trip_number ?? "—");
        if (b.status !== "approved") return text;
        const href = `../terminal-operating-system/bays.html?date=${encodeURIComponent(
          b.booking_date ?? currentDate
        )}&trip=${encodeURIComponent(b.id)}`;
        return `<a href="${href}" title="Open in Terminal Operating System">${text}</a>`;
      }

      await load();

      async function load() {
        const [baysRes, bookingsRes] = await Promise.all([
          supabase.from("bays").select("id, name, gate").eq("is_active", true),
          supabase
            .from("bookings")
            .select(
              "id, operator_name, trade_name, route, plate_no, booking_date, slot, status, previously_approved, trip_number, bays ( id, name )"
            )
            .gte("booking_date", rangeFrom())
            .lte("booking_date", rangeTo())
            // A live board shows confirmed trips, not staff's internal
            // approval queue (that's Pending requests) - approved trips,
            // plus cancellations of a trip that was actually confirmed
            // at some point (a request cancelled before ever being
            // approved never had a real slot to show here).
            .or("status.eq.approved,and(status.eq.cancelled,previously_approved.eq.true)")
            .order("slot", { ascending: true }),
        ]);

        if (bookingsRes.error) {
          showMessage("message", bookingsRes.error.message);
          return;
        }

        activeBays = baysRes.data ?? [];
        const totalBays = activeBays.length;
        const bookings = bookingsRes.data ?? [];
        lastDayBookings = bookings;

        document.getElementById("capacity-note").textContent =
          `Trips scheduled for ${rangeMode === "week" ? weekRangeLabel(weekStartISO(currentDate)) : currentDate}, across ${totalBays} active bay${
            totalBays === 1 ? "" : "s"
          }.`;

        renderBoard();
      }

      // Groups bookings by slot (skipping any slot with nothing
      // scheduled - a real departures board doesn't print empty times)
      // and renders one time-divider row per group, PIDS-style.
      // Filters lastDayBookings by the board's search box before
      // grouping. A day here can run to several hundred rows (366 on a
      // busy date), which is a lot to scan for one operator's trip.
      function matchesBoardFilter(b) {
        const q = document.getElementById('board-search').value.trim().toLowerCase();
        if (!q) return true;
        return [b.operator_name, b.trade_name, b.route, b.plate_no, b.trip_number, b.bays?.name]
          .filter(Boolean)
          .some((v) => String(v).toLowerCase().includes(q));
      }

      function renderWeekBoard() {
        renderWeek(document.getElementById("grid"), {
          weekStart: weekStartISO(currentDate),
          bookings: lastDayBookings.filter(matchesBoardFilter),
          today: todayISO(),
          mineId: typeof viewMode !== "undefined" && viewMode === "all" ? profile.id : null,
          onOpenDay: (d) => {
            currentDate = d;
            dateInput.value = d;
            setRange("day");
          },
        });
      }

      function renderBoard() {
        if (rangeMode === "week") return renderWeekBoard();
        const bookings = lastDayBookings.filter(matchesBoardFilter);
        const host = document.getElementById("grid");

        if (bookings.length === 0) {
          host.innerHTML = `
            <div class="pids-wrap">
              <p class="pids-empty">${
                lastDayBookings.length === 0
                  ? "No trips scheduled for this date."
                  : "No trips match this filter."
              }</p>
            </div>`;
          return;
        }

        const bySlot = new Map();
        for (const b of bookings) {
          if (!bySlot.has(b.slot)) bySlot.set(b.slot, []);
          bySlot.get(b.slot).push(b);
        }
        const slotsInOrder = [...bySlot.keys()].sort((a, b) => a - b);

        host.innerHTML = `
          <div class="pids-wrap">
            <div class="table-wrap table-plain" style="max-height: 70vh; overflow-y: auto">
              <table class="pids-table">
                <thead>
                  <tr>
                    <th>Company</th>
                    <th>Trip No.</th>
                    <th>Plate No.</th>
                    <th>Destination</th>
                    <th class="pids-num">Gate</th>
                    <th class="pids-num">Bay</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  ${slotsInOrder
                    .map((slot) => {
                      const rows = bySlot.get(slot);
                      const timeLabel = formatSlotStart(slot);
                      const rowsHtml = rows
                        .map((b) => {
                          const label = b.operator_name || "Operator";
                          return `
                        <tr class="pids-row${isCancelled(b) ? " is-cancelled" : ""}">
                          <td>
                            <div class="pids-company">
                              <span class="pids-avatar" style="background:${avatarColor(label)}">${escapeHtml(
                                initials(label)
                              )}</span>
                              <span class="pids-company-name">${bookingOperatorHtml(b)}</span>
                            </div>
                          </td>
                          <td class="pids-trip-no">${tosTripLink(b)}</td>
                          <td>${
                            b.plate_no
                              ? escapeHtml(b.plate_no)
                              : `<span class="pids-no-plate">No plate</span>`
                          }</td>
                          <td>${escapeHtml((b.route ?? "—").toUpperCase())}</td>
                          <td class="pids-num">${escapeHtml(bareGate(b.route))}</td>
                          <td class="pids-num" data-bay-cell="${escapeHtml(b.id)}">${
                            !isCancelled(b) && !hasDeparted(b)
                              ? bayReassignHtml(b)
                              : escapeHtml(bareBay(b.bays?.name))
                          }</td>
                          <td class="pids-num">${
                            !isCancelled(b) && !hasDeparted(b)
                              ? `<button type="button" class="btn-link" data-edit-trip="${escapeHtml(b.id)}">Plate / operator</button>`
                              : ""
                          }</td>
                        </tr>`;
                        })
                        .join("");
                      return `
                      <tr class="pids-time-row">
                        <td colspan="7">${escapeHtml(timeLabel)}</td>
                      </tr>
                      ${rowsHtml}`;
                    })
                    .join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;

        document.querySelectorAll("[data-edit-trip]").forEach((btn) => {
          btn.addEventListener("click", () => openTripEditor(btn.dataset.editTrip));
        });
        document.querySelectorAll("[data-reassign-bay]").forEach((form) => {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            reassignBay(
              form.dataset.reassignBay,
              form.querySelector("select").value
            );
          });
        });
      }

      // Staff can move an already-approved booking to a different bay -
      // e.g. correcting a mistaken assignment, or freeing up a bay for an
      // operational reason. Options are grouped: bays at the gate this
      // route is meant to use first, then every other bay not already
      // taken for this slot (the current bay is always included, even if
      // it's outside the suggested gate, so re-opening this never loses
      // the existing value). Only offered on trips still "Arriving" -
      // once a trip has departed, its bay is history, not something to
      // reassign.
      function bayReassignHtml(booking) {
        const takenIds = new Set(
          lastDayBookings
            .filter(
              (other) =>
                other.slot === booking.slot &&
                other.status === "approved" &&
                other.id !== booking.id &&
                other.bays?.id
            )
            .map((other) => other.bays.id)
        );
        const available = activeBays.filter(
          (bay) => bay.id === booking.bays?.id || !takenIds.has(bay.id)
        );

        const gate = gateForRoute(booking.route);
        const suggested = gate ? available.filter((bay) => bay.gate === gate) : [];
        const other = gate ? available.filter((bay) => bay.gate !== gate) : available;

        const optionsHtml = (list) =>
          list
            .map(
              (bay) =>
                `<option value="${bay.id}"${
                  bay.id === booking.bays?.id ? " selected" : ""
                }>${escapeHtml(bareNumber("Bay", bay.name))}</option>`
            )
            .join("");

        return `
          <form class="pids-bay-reassign" data-reassign-bay="${escapeHtml(booking.id)}">
            <select onchange="this.form.requestSubmit()">
              ${
                suggested.length
                  ? `<optgroup label="Suggested (${escapeHtml(gate)})">${optionsHtml(
                      suggested
                    )}</optgroup>`
                  : ""
              }
              ${
                other.length
                  ? `<optgroup label="${suggested.length ? "Other bays" : "Bays"}">${optionsHtml(
                      other
                    )}</optgroup>`
                  : ""
              }
            </select>
          </form>
        `;
      }

      // Staff-side plate entry and operator swap. Changing only the plate goes
      // through staff_set_booking_plate; picking a different operator goes
      // through staff_reassign_booking, which needs that operator's vehicle and
      // keeps the bay and slot. Both enforce eligibility in the database -
      // these lists are just the choices that will be accepted.
      let editingId = null;
      let editingOperatorName = "";
      const tripDialog = document.getElementById("trip-dialog");
      const tripOperator = document.getElementById("trip-operator");
      const tripPlate = document.getElementById("trip-plate");

      async function loadPlateChoices(username, currentPlate) {
        tripPlate.disabled = true;
        tripPlate.innerHTML = `<option value="" disabled selected>Loading…</option>`;
        const { data, error } = await supabase.rpc("staff_list_booking_vehicles", {
          p_booking_id: editingId,
          p_username: username,
        });
        const vehicles = error ? [] : data ?? [];
        const norm = (v) => String(v ?? "").toUpperCase().replace(/[^A-Z0-9]/g, "");
        tripPlate.innerHTML =
          (username ? "" : `<option value="">No plate yet</option>`) +
          (vehicles.length === 0
            ? `<option value="" disabled ${username ? "selected" : ""}>No eligible vehicles</option>`
            : username
            ? `<option value="" disabled selected>Select a vehicle</option>`
            : "") +
          vehicles
            .map(
              (v) =>
                `<option value="${escapeHtml(v.plate_no)}"${
                  !username && norm(v.plate_no) === norm(currentPlate) ? " selected" : ""
                }>${escapeHtml(v.plate_no)}${v.body_number ? " · " + escapeHtml(v.body_number) : ""}</option>`
            )
            .join("");
        tripPlate.disabled = false;
      }

      async function openTripEditor(bookingId) {
        const b = lastDayBookings.find((x) => x.id === bookingId);
        if (!b) return;
        editingId = bookingId;
        editingOperatorName = b.operator_name ?? "this operator";
        showMessage("trip-message", "");
        document.getElementById("trip-context").textContent =
          `${formatSlotStart(b.slot)} · ${b.route} · ${b.booking_date ?? currentDate}`;
        tripOperator.innerHTML = `<option value="">${escapeHtml(editingOperatorName)} (current)</option>`;
        document.getElementById("trip-hint").textContent =
          "Change the plate for the current operator, or pick another operator to move the trip to them (their vehicle is required). The bay stays the same.";
        tripDialog.showModal();
        loadPlateChoices(null, b.plate_no);
        const { data } = await supabase.rpc("staff_list_reassign_operators", { p_booking_id: bookingId });
        tripOperator.innerHTML =
          `<option value="">${escapeHtml(editingOperatorName)} (current)</option>` +
          (data ?? [])
            .map((o) => `<option value="${escapeHtml(o.username)}">${escapeHtml(o.operator_name ?? o.username)}</option>`)
            .join("");
      }

      tripOperator.addEventListener("change", () => {
        const b = lastDayBookings.find((x) => x.id === editingId);
        loadPlateChoices(tripOperator.value || null, b?.plate_no);
      });
      document.getElementById("trip-cancel").addEventListener("click", () => tripDialog.close());
      document.getElementById("trip-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        showMessage("trip-message", "");
        const username = tripOperator.value || null;
        const plate = tripPlate.value;
        if (username && !plate) return showMessage("trip-message", "Pick the receiving operator's vehicle.");
        const { error } = username
          ? await supabase.rpc("staff_reassign_booking", {
              p_booking_id: editingId,
              p_to_username: username,
              p_plate_no: plate,
            })
          : await supabase.rpc("staff_set_booking_plate", {
              p_booking_id: editingId,
              p_plate_no: plate,
            });
        if (error) return showMessage("trip-message", error.message);
        tripDialog.close();
        showMessage(
          "message",
          username ? "Trip moved to the new operator." : plate ? `Plate set to ${plate}.` : "Plate cleared.",
          "ok"
        );
        await load();
      });

      async function reassignBay(bookingId, bayIdRaw) {
        showMessage("message", "");
        if (!bayIdRaw) return;

        const { error } = await supabase
          .from("bookings")
          .update({ assigned_bay_id: Number(bayIdRaw) })
          .eq("id", bookingId)
          .eq("status", "approved");

        if (error) {
          // 23505 = unique violation on the approved bay/slot index.
          showMessage(
            "message",
            error.code === "23505"
              ? "That bay is already taken for this slot. Pick a different one."
              : error.message
          );
          return;
        }
        await load();
      }
    </script>
  </body>
</html>
