<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bays · PITX Trip Scheduling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="nav"></aside>
      <div class="app-content">
        <main class="wrap wrap-narrow">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Terminal Layout</p>
          <h1>Bays</h1>
          <p class="subtle" id="count-note"></p>
        </div>
      </div>

      <div class="hidden" id="message"></div>

      <div class="card">
        <form id="add-form" style="display: flex; gap: 12px; align-items: flex-end">
          <div class="field" style="flex: 1">
            <label for="name">New bay name</label>
            <input id="name" name="name" placeholder="e.g. Bay 21" required />
          </div>
          <button type="submit" class="btn-primary">Add bay</button>
        </form>
      </div>

      <div id="list"></div>
    </main>
      </div>
    </div>
      </div>
    </div>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        compareBayNames,
        showMessage,
        escapeHtml,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      document.getElementById("add-form").addEventListener("submit", addBay);
      await load();

      async function load() {
        const { data } = await supabase
          .from("bays")
          .select("id, name, gate, is_active");

        const bays = (data ?? []).sort((a, b) =>
          compareBayNames(a.name, b.name)
        );
        const activeCount = bays.filter((b) => b.is_active).length;

        document.getElementById("count-note").textContent =
          `${activeCount} active bay${activeCount === 1 ? "" : "s"} — this is ` +
          `the maximum number of approved bookings allowed per 15-minute slot.`;

        // One table per gate (numeric order), bays with no gate last.
        const gateKey = (g) => g ?? "";
        const gates = [...new Set(bays.map((b) => gateKey(b.gate)))].sort((a, b) =>
          a === "" ? 1 : b === "" ? -1 : a.localeCompare(b, undefined, { numeric: true })
        );
        const rowHtml = (bay) => `
                  <tr>
                    <td>${escapeHtml(bay.name)}</td>
                    <td><span class="badge badge-${
                      bay.is_active ? "active" : "inactive"
                    }">${bay.is_active ? "Active" : "Inactive"}</span></td>
                    <td style="text-align: right">
                      <button type="button" class="btn-link"
                        data-rename="${bay.id}" data-name="${escapeHtml(bay.name)}">Rename</button>
                      <button type="button" class="btn-link"
                        data-toggle="${bay.id}"
                        data-next="${(!bay.is_active).toString()}">${
                      bay.is_active ? "Deactivate" : "Activate"
                    }</button>
                    </td>
                  </tr>`;

        document.getElementById("list").innerHTML = gates
          .map((g) => {
            const inGate = bays.filter((b) => gateKey(b.gate) === g);
            const active = inGate.filter((b) => b.is_active).length;
            return `
          <p class="section-head">${escapeHtml(g || "No gate")} <span class="subtle">&middot; ${active} active of ${inGate.length}</span></p>
          <div class="table-wrap table-plain">
            <table>
              <thead>
                <tr><th>Bay</th><th>Status</th><th></th></tr>
              </thead>
              <tbody>
                ${inGate.map(rowHtml).join("")}
              </tbody>
            </table>
          </div>`;
          })
          .join("");

        document.querySelectorAll("[data-toggle]").forEach((btn) => {
          btn.addEventListener("click", () =>
            setActive(Number(btn.dataset.toggle), btn.dataset.next === "true")
          );
        });
        document.querySelectorAll("[data-rename]").forEach((btn) => {
          btn.addEventListener("click", () =>
            renameBay(Number(btn.dataset.rename), btn.dataset.name)
          );
        });
      }

      async function renameBay(bayId, currentName) {
        const name = prompt("Rename bay:", currentName)?.trim();
        if (!name || name === currentName) return;

        showMessage("message", "");
        const { error } = await supabase
          .from("bays")
          .update({ name })
          .eq("id", bayId);
        if (error) return showMessage("message", error.message);
        await load();
      }

      async function addBay(event) {
        event.preventDefault();
        showMessage("message", "");

        const input = document.getElementById("name");
        const name = input.value.trim();
        if (!name) return showMessage("message", "Bay name is required.");

        const { error } = await supabase.from("bays").insert({ name });
        if (error) return showMessage("message", error.message);

        input.value = "";
        await load();
      }

      async function setActive(bayId, isActive) {
        showMessage("message", "");
        const { error } = await supabase
          .from("bays")
          .update({ is_active: isActive })
          .eq("id", bayId);
        if (error) return showMessage("message", error.message);
        await load();
      }
    </script>
  </body>
</html>
