<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview · PITX Trip Scheduling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
    <style>
      /* Page-local additions - just this page's quick-link grid and the
         "approaching lockout" alert list, styled to sit alongside the
         shared .kpis/.kpi/.hint/.warn classes from styles.css rather than
         duplicating them. */
      .kpi-link {
        display: block;
        text-decoration: none;
        color: inherit;
      }
      .kpi-link:hover .kpi {
        border-color: var(--title, #333);
      }

      .lockout-card {
        border-radius: var(--r-card-sm, 14px);
        padding: 14px 18px;
        margin-bottom: 18px;
      }
      .lockout-card.is-urgent {
        background: var(--amber-wash);
        color: var(--amber-ink);
      }
      .lockout-card.is-calm {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--label);
      }
      .lockout-title {
        font-weight: 700;
        margin: 0 0 8px;
      }
      .lockout-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .lockout-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.35);
        border-radius: 10px;
        padding: 8px 12px;
      }
      .lockout-list a {
        color: inherit;
        font-weight: 700;
        text-decoration: underline;
        white-space: nowrap;
      }

      .quick-links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-top: 8px;
      }
      .quick-link {
        display: block;
        text-decoration: none;
        color: var(--title);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-card-sm, 14px);
        padding: 16px 18px;
        font-weight: 700;
        font-size: 14px;
        transition: border-color 0.15s ease;
      }
      .quick-link:hover {
        border-color: var(--title);
      }

      .section-head {
        margin: 28px 0 10px;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: oklch(52% 0.02 260);
      }

      .util-bar-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 220px;
      }
      .util-bar {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: var(--ground-alt, #eef0f3);
        overflow: hidden;
      }
      .util-bar-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--blue, #2f5fd0);
      }
      .util-bar-fill.is-high {
        background: var(--amber-ink, #a15c00);
      }
      .util-bar-fill.is-full {
        background: var(--red-ink, #9c1f22);
      }
      .util-pct {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 12px;
        min-width: 42px;
        text-align: right;
      }
      .util-section {
        margin-top: 34px;
      }


      .util-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 12px;
        margin: 28px 0 4px;
      }
      .util-head .section-head {
        margin: 0;
      }
    
      .hint-link {
        display: block;
        text-decoration: none;
        margin: 10px 0 0;
      }
      .hint-link:hover {
        color: var(--amber-ink);
        border-color: var(--amber-ink);
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="nav"></aside>
      <div class="app-content">
        <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Command Center</p>
          <h1>Overview</h1>
          <p class="subtle">
            The dashboard: everything waiting on staff, today's board, and how
            hard each gate is working over a date range.
          </p>
        </div>
      </div>

      <div class="kpis" id="kpis"></div>

      <p class="section-head" id="lockout-head">Approaching lockout</p>
      <div id="lockout"></div>
      <a id="unlinked-note" class="hint hint-link hidden" href="vehicles-database.html?filter=unlinked"></a>

      <div class="util-head" id="utilization">
        <p class="section-head">Utilization</p>
        <div class="toolbar" style="margin: 0">
          <input type="date" id="from" />
          <input type="date" id="to" />
          <button type="button" class="btn-outline" id="apply">Apply</button>
          <details class="row-menu"><summary class="menu-btn" aria-label="More">&#8943;</summary><div class="row-menu-pop"><button type="button" class="btn-link" id="export-csv">Export CSV</button></div></details>
        </div>
      </div>
      <div class="hidden" id="message"></div>
      <div class="kpis" id="util-kpis" style="margin-top: 10px"></div>

      <p class="section-head">By gate</p>
      <div id="by-gate"></div>

      <p class="section-head util-section">Busiest times</p>
      <div id="by-slot"></div>

    </main>
      </div>
    </div>
      </div>
    </div>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        escapeHtml,
        todayISO,
        addDays,
        slotStartMillis,
        BOOKING_LEAD_TIME_MS,
        fetchAllRows,
        formatSlotStart,
        bookingOperatorHtml,
        showMessage,
        downloadCsv,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      // Half the booking-lockout window - requests inside this band are
      // still pending but will lose their lead time soon, so they're
      // surfaced here rather than only showing up once staff happen to
      // check the Pending requests queue.
      const URGENT_WINDOW_MS = BOOKING_LEAD_TIME_MS / 2;

      // Both derived from BOOKING_LEAD_TIME_MS rather than written out,
      // so the copy can't drift from the actual rule the way a hardcoded
      // "4-hour" did when the lockout dropped to 2 hours (#86).
      const LOCKOUT_HOURS = BOOKING_LEAD_TIME_MS / 3600000;
      const URGENT_HOURS = URGENT_WINDOW_MS / 3600000;
      const plural = (n) => (n === 1 ? "" : "s");

      // Utilization state - declared before the first load() below, which
      // reaches it at module top-level (same temporal-dead-zone care as every
      // page here).
      let gateRows = [];
      let slotRows = [];
      const fromInput = document.getElementById("from");
      const toInput = document.getElementById("to");
      // Default to the last 30 days, the window most "how are we doing"
      // questions are actually about.
      toInput.value = todayISO();
      fromInput.value = addDays(todayISO(), -29);
      document.getElementById("apply").addEventListener("click", loadUtilization);
      document.getElementById("export-csv").addEventListener("click", exportCsv);

      await load();

      async function load() {
        const today = todayISO();

        const [
          pendingBookingsRes,
          pendingVehiclesRes,
          transfersAwaitingStaffRes,
          transfersAwaitingOperatorRes,
          approvedTodayRes,
          cancelledTodayRes,
          activeBaysRes,
        ] = await Promise.all([
          fetchAllRows((from, to) =>
            supabase
              .from("bookings")
              .select("id, operator_name, trade_name, route, plate_no, booking_date, slot")
              .eq("status", "pending")
              .range(from, to)
          ),
          supabase
            .from("vehicles")
            .select("id", { count: "exact", head: true })
            .eq("status", "pending"),
          supabase
            .from("booking_transfers")
            .select("id", { count: "exact", head: true })
            .eq("status", "pending")
            .eq("recipient_response", "accepted"),
          supabase
            .from("booking_transfers")
            .select("id", { count: "exact", head: true })
            .eq("status", "pending")
            .eq("recipient_response", "pending"),
          supabase
            .from("bookings")
            .select("id", { count: "exact", head: true })
            .eq("status", "approved")
            .eq("booking_date", today),
          // Same "was this trip ever actually confirmed" rule the
          // Schedule board itself used before its own KPI strip moved
          // here (#95) - a request cancelled before approval never had a
          // real slot to lose, so it doesn't count as a cancellation.
          supabase
            .from("bookings")
            .select("id", { count: "exact", head: true })
            .eq("status", "cancelled")
            .eq("previously_approved", true)
            .eq("booking_date", today),
          supabase.from("bays").select("id", { count: "exact", head: true }).eq("is_active", true),
        ]);

        const pendingBookings = pendingBookingsRes.data ?? [];

        renderKpis({
          pendingCount: pendingBookings.length,
          pendingVehicles: pendingVehiclesRes.count ?? 0,
          transfersAwaitingStaff: transfersAwaitingStaffRes.count ?? 0,
          transfersAwaitingOperator: transfersAwaitingOperatorRes.count ?? 0,
          approvedToday: approvedTodayRes.count ?? 0,
          cancelledToday: cancelledTodayRes.count ?? 0,
          activeBays: activeBaysRes.count ?? 0,
          today,
        });

        renderLockout(pendingBookings);
        await loadUtilization();
      }

      function renderKpis({
        pendingCount,
        pendingVehicles,
        transfersAwaitingStaff,
        transfersAwaitingOperator,
        approvedToday,
        cancelledToday,
        activeBays,
        today,
      }) {
        const scheduleHref = `schedule.html?date=${encodeURIComponent(today)}`;
        // Four tiles (it was seven): the three queues that need a decision, plus
        // today's board with cancellations folded into it.
        const tiles = [
          { label: "Pending requests", value: pendingCount, unit: "requests", href: "approvals.html?type=requests" },
          { label: "Vehicle approvals", value: pendingVehicles, unit: "vehicles", href: "approvals.html?type=vehicles" },
          { label: "Transfers awaiting you", value: transfersAwaitingStaff, unit: "transfers", href: "approvals.html?type=transfers" },
          {
            label: "Today",
            value: approvedToday,
            unit: cancelledToday > 0 ? `trips · ${cancelledToday} cancelled` : "trips",
            href: scheduleHref,
          },
        ];

        document.getElementById("kpis").innerHTML = tiles
          .map(
            (k) => `
            <a class="kpi-link" href="${escapeHtml(k.href)}">
              <div class="kpi">
                <div class="kpi-label">${escapeHtml(k.label)}</div>
                <div class="kpi-value">
                  <strong>${k.value}</strong><span>${escapeHtml(k.unit)}</span>
                </div>
              </div>
            </a>`
          )
          .join("");
      }

      // The Utilization page's contents, moved here so Overview is the one
      // dashboard (9 Oct): headline numbers for the range, by-gate table,
      // busiest hours, and the unlinked-route worklist (only shown when
      // there is something to fix). utilization.html now just redirects here.
      async function loadUtilization() {
        await loadUtilizationRange();
        await loadUnlinked();
      }

      function renderUtilKpis() {
        const trips = gateRows.reduce((n, r) => n + Number(r.trips), 0);
        const cancelled = gateRows.reduce((n, r) => n + Number(r.cancelled), 0);
        const days = new Set(gateRows.map((r) => r.booking_date)).size;
        const capacity = gateRows.reduce((n, r) => n + Number(r.slot_capacity), 0);
        const pct = capacity > 0 ? Math.round((trips / capacity) * 1000) / 10 : 0;
        const tiles = [
          ["Approved trips", trips, "trips"],
          ["Slot occupancy", `${pct}%`, "of capacity"],
          ["Cancelled after approval", cancelled, "trips"],
          ["Days with activity", days, "days"],
        ];
        document.getElementById("util-kpis").innerHTML = tiles
          .map(
            ([label, value, unit]) => `
            <div class="kpi">
              <div class="kpi-label">${escapeHtml(label)}</div>
              <div class="kpi-value"><strong>${escapeHtml(String(value))}</strong><span>${escapeHtml(unit)}</span></div>
            </div>`
          )
          .join("");
      }

      async function loadUtilizationRange() {
        showMessage("message", "");
        const from = fromInput.value;
        const to = toInput.value;
        if (!from || !to || from > to) {
          showMessage("message", "Pick a start date on or before the end date.");
          return;
        }

        // Aggregated server-side (migration 0045) rather than pulling
        // every booking in the range and counting in the browser - the
        // same unbounded-fetch trap #86 fixed on the approvals page.
        const { data, error } = await supabase.rpc("utilization_by_gate", {
          p_from: from,
          p_to: to,
        });
        if (error) {
          showMessage("message", error.message);
          return;
        }
        gateRows = data ?? [];

        await loadSlotProfile(from, to);
        renderUtilKpis();
        renderByGate();
        renderBySlot();
      }

      // Which times of day are busiest across the range. Needs the raw
      // slots rather than the gate aggregate, but only two small columns,
      // and paged so a wide range can't silently truncate.
      async function loadSlotProfile(from, to) {
        const { data, error } = await fetchAllRows((a, b) =>
          supabase
            .from("bookings")
            .select("slot")
            .eq("status", "approved")
            .gte("booking_date", from)
            .lte("booking_date", to)
            .range(a, b)
        );
        if (error) {
          showMessage("message", error.message);
          slotRows = [];
          return;
        }
        slotRows = data ?? [];
      }

      // Rolled up per gate across the whole range - the per-day rows the
      // RPC returns are the input, but "which gate is under pressure" is
      // the question, and one row per gate answers it directly.
      function gateTotals() {
        const byGate = new Map();
        for (const r of gateRows) {
          const cur = byGate.get(r.gate) ?? {
            gate: r.gate,
            trips: 0,
            cancelled: 0,
            capacity: 0,
            bays: Number(r.bays_at_gate),
            days: new Set(),
          };
          cur.trips += Number(r.trips);
          cur.cancelled += Number(r.cancelled);
          cur.capacity += Number(r.slot_capacity);
          cur.days.add(r.booking_date);
          byGate.set(r.gate, cur);
        }
        return [...byGate.values()].sort((a, b) => b.trips - a.trips);
      }

      function barHtml(pct) {
        const cls = pct >= 90 ? " is-full" : pct >= 60 ? " is-high" : "";
        return `
          <div class="util-bar-wrap">
            <div class="util-bar">
              <div class="util-bar-fill${cls}" style="width:${Math.min(pct, 100)}%"></div>
            </div>
            <span class="util-pct">${pct}%</span>
          </div>`;
      }

      function renderByGate() {
        const host = document.getElementById("by-gate");
        const totals = gateTotals();

        if (totals.length === 0) {
          host.innerHTML = `<p class="empty">No approved trips in this range.</p>`;
          return;
        }

        host.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Gate</th><th>Bays</th><th>Approved trips</th>
                  <th>Cancelled</th><th>Avg trips / day</th><th>Slot occupancy</th>
                </tr>
              </thead>
              <tbody>
                ${totals
                  .map((t) => {
                    const pct =
                      t.capacity > 0 ? Math.round((t.trips / t.capacity) * 1000) / 10 : 0;
                    const perDay = t.days.size
                      ? Math.round((t.trips / t.days.size) * 10) / 10
                      : 0;
                    return `
                  <tr>
                    <td data-label="Gate">${escapeHtml(t.gate)}</td>
                    <td data-label="Bays">${t.bays}</td>
                    <td data-label="Approved trips">${t.trips}</td>
                    <td data-label="Cancelled">${t.cancelled}</td>
                    <td data-label="Avg trips / day">${perDay}</td>
                    <td data-label="Slot occupancy">${barHtml(pct)}</td>
                  </tr>`;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderBySlot() {
        const host = document.getElementById("by-slot");
        if (slotRows.length === 0) {
          host.innerHTML = `<p class="empty">No approved trips in this range.</p>`;
          return;
        }

        // Grouped by hour rather than by 15-minute slot - 96 rows of
        // mostly-similar numbers doesn't answer "when are we busy".
        const byHour = new Map();
        for (const r of slotRows) {
          const hour = Math.floor(r.slot / 4);
          byHour.set(hour, (byHour.get(hour) ?? 0) + 1);
        }
        const peak = Math.max(...byHour.values());
        const hours = [...byHour.entries()].sort((a, b) => a[0] - b[0]);

        host.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Hour</th><th>Approved trips</th><th>Relative volume</th></tr>
              </thead>
              <tbody>
                ${hours
                  .map(
                    ([hour, count]) => `
                  <tr>
                    <td data-label="Hour">${escapeHtml(formatSlotStart(hour * 4))}</td>
                    <td data-label="Approved trips">${count}</td>
                    <td data-label="Relative volume">${barHtml(
                      Math.round((count / peak) * 1000) / 10
                    )}</td>
                  </tr>`
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      // Approved vehicles whose `route` isn't one of the app's canonical
      // routes (free text left over from the masterlist import, or null).
      // They can never be picked for a booking and nothing in the
      // operator's UI explains why - found in the #86 test pass.
      // Approved vehicles whose route isn't one of the terminal's routes can
      // never be booked, and nothing in the operator's UI says why. Overview
      // only carries the summary; the list itself is on the Vehicles page
      // (vehicles-database.html?filter=unlinked), one click from this note.
      // Hidden when there is nothing to fix.
      async function loadUnlinked() {
        const note = document.getElementById("unlinked-note");
        const { data, error } = await supabase.rpc("vehicles_with_unlinked_route");
        const n = error ? 0 : (data ?? []).length;
        note.classList.toggle("hidden", n === 0);
        if (n === 0) return;
        note.innerHTML =
          `<strong>${n} approved vehicle${n === 1 ? "" : "s"}</strong> can't be booked - ${
            n === 1 ? "its route isn't" : "their routes aren't"
          } one of the terminal's routes. Review on Vehicles &rarr;`;
      }

      function exportCsv() {
        const rows = gateTotals().map((t) => [
          t.gate,
          t.bays,
          t.trips,
          t.cancelled,
          t.days.size ? Math.round((t.trips / t.days.size) * 10) / 10 : 0,
          t.capacity > 0 ? Math.round((t.trips / t.capacity) * 1000) / 10 : 0,
        ]);
        downloadCsv(
          `utilization-${fromInput.value}-to-${toInput.value}.csv`,
          ["Gate", "Bays", "Approved trips", "Cancelled", "Avg trips / day", "Slot occupancy %"],
          rows
        );
      }

      function renderLockout(pendingBookings) {
        const now = Date.now();
        const urgent = pendingBookings
          .map((b) => {
            const timeToSlot = slotStartMillis(b.booking_date, b.slot) - now;
            // Not "time until the slot starts" - time until this request
            // hits the booking lockout and can no longer be changed at
            // all. A request 2h50m from its slot is 50m from that
            // deadline, not "50m away" itself - subtracting the lockout
            // window is what turns "time to slot" into "time to act".
            return { ...b, remainingMs: timeToSlot - BOOKING_LEAD_TIME_MS };
          })
          // Not yet locked out (still approvable) and inside the urgent
          // half of the window before it becomes un-approvable.
          .filter((b) => b.remainingMs >= 0 && b.remainingMs <= URGENT_WINDOW_MS)
          .sort((a, b) => a.remainingMs - b.remainingMs);

        const host = document.getElementById("lockout");

        document.getElementById("lockout-head").classList.toggle("hidden", urgent.length === 0);
        if (urgent.length === 0) {
          // Nothing near lockout: no box, no heading.
          host.innerHTML = "";
          return;
        }

        host.innerHTML = `
          <div class="lockout-card is-urgent">
            <p class="lockout-title">
              ${urgent.length} pending request${urgent.length === 1 ? "" : "s"}
              approaching lockout
            </p>
            <ul class="lockout-list">
              ${urgent
                .map((b) => {
                  const hoursLeft = (b.remainingMs / 3600000).toFixed(1);
                  return `
                    <li>
                      <span>
                        ${bookingOperatorHtml(b)} &middot; ${escapeHtml(
                          b.route
                        )} &middot; ${escapeHtml(b.plate_no)}
                        &middot; ${escapeHtml(b.booking_date)} ${escapeHtml(
                          formatSlotStart(b.slot)
                        )}
                        &middot; ${hoursLeft}h left
                      </span>
                      <a href="approvals.html?type=requests">Review &rarr;</a>
                    </li>
                  `;
                })
                .join("")}
            </ul>
          </div>
        `;
      }

    </script>
  </body>
</html>
