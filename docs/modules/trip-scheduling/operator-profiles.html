<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operator profiles · PITX Trip Scheduling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="nav"></aside>
      <div class="app-content">
        <main class="wrap">
      <div class="page-head">
        <div>
          <p class="eyebrow">Transport Operations &middot; Company Details</p>
          <h1>Operator profiles</h1>
          <p class="subtle">
            Read-only view of each operator account's company details, from
            the top of the PITX/MWM Terminals registration form. Operators
            edit their own on <strong>Operator profile</strong> - no
            approval step, so what's shown here is always current.
          </p>
        </div>
        <div>
          <p class="subtle" id="summary-count"></p>
          <details class="row-menu"><summary class="menu-btn" aria-label="More">&#8943;</summary><div class="row-menu-pop"><button type="button" class="btn-link" id="export-csv">Export CSV</button></div></details>
        </div>
      </div>

      <div class="toolbar" style="justify-content: space-between; margin-bottom: 20px">
        <div class="field" style="max-width: 360px; margin-bottom: 0">
          <label for="search">Search</label>
          <input
            id="search"
            placeholder="Username, operator, or company name…"
          />
        </div>
        <div class="mode-switch" role="tablist" id="profile-filter">
          <button type="button" class="mode-tab is-active" data-filter="all">All</button>
          <button type="button" class="mode-tab" data-filter="missing">Missing profile</button>
        </div>
      </div>

      <div class="hidden" id="message"></div>
      <div id="list"></div>
    </main>
      </div>
    </div>
      </div>
    </div>

    <!-- ------------------------------------------------- details dialog -->
    <dialog class="details-dialog" id="details-dialog">
      <h2 class="dialog-title" id="details-title"></h2>
      <p class="subtle" id="details-sub"></p>
      <div id="details-body" class="details-grid"></div>
      <div class="dialog-actions">
        <button type="button" class="btn-outline" id="details-close">Close</button>
      </div>
    </dialog>

    <script type="module">
      import {
        supabase,
        guardPage,
        renderNav,
        showMessage,
        escapeHtml,
        downloadCsv,
        initials,
      } from "./assets/app.js";

      const profile = await guardPage("staff");
      if (!profile) throw new Error("unauthorised");
      renderNav(profile);

      let rows = [];
      let profileFilter = "all";
      let rowsById = new Map();
      // The exact filtered set currently on screen - shared between
      // render() and exportCsv() so the CSV always matches what's visible.
      // Must be declared up here, before the `await load()` a few lines
      // down - load() -> render() reads this at module top-level, which
      // would otherwise run while this `let` is still in its temporal
      // dead zone (same class of bug as #37/#39/#46/#52/#66).
      let lastVisibleRows = [];

      document.getElementById("search").addEventListener("input", render);
      document.querySelectorAll("#profile-filter [data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          profileFilter = btn.dataset.filter;
          document
            .querySelectorAll("#profile-filter [data-filter]")
            .forEach((b) => b.classList.toggle("is-active", b === btn));
          render();
        });
      });
      document.getElementById("export-csv").addEventListener("click", exportCsv);
      initDetailsDialog();
      await load();

      // A contact's plain-text one-liner ("Name (Position) · Number ·
      // Email"), used by both the table cell and the CSV export so the
      // two always agree. `contacts` is the new JSONB array
      // (migration 0037) - up to 5 entries, replacing the old fixed
      // contact1_*/contact2_* column pairs.
      function contactLine(c) {
        if (!c?.name) return "";
        return [
          c.position ? `${c.name} (${c.position})` : c.name,
          c.number || null,
          c.email || null,
        ]
          .filter(Boolean)
          .join(" · ");
      }

      function exportCsv() {
        downloadCsv(
          "operator-profiles.csv",
          [
            "Operator", "Username", "Company", "Trade Name", "Operator/Trade Code",
            "Owner", "Booking system", "Contacts",
          ],
          currentRows().map((r) => {
            const p = r.companyProfile;
            const contactsText = (p?.contacts ?? [])
              .map(contactLine)
              .filter(Boolean)
              .join("; ");
            return [
              r.operator_name || r.username,
              r.username,
              p?.company_name ?? "",
              p?.trade_name ?? "",
              p?.operator_code ?? "",
              p?.company_owner ?? "",
              !p ? "" : p.has_booking_system ? p.booking_system_name || "Yes" : "No",
              contactsText,
            ];
          })
        );
      }

      function currentRows() {
        return lastVisibleRows;
      }

      async function load() {
        // Every operator account, not just the ones that have saved a
        // profile - staff need to see who *hasn't* submitted one yet, not
        // just the ones who have.
        const [{ data: operators, error: opError }, { data: profiles, error: profError }] =
          await Promise.all([
            supabase
              .from("profiles")
              .select("id, username, operator_name")
              .eq("role", "operator")
              .order("operator_name", { ascending: true, nullsFirst: false })
              .order("username", { ascending: true })
              .range(0, 4999),
            supabase.from("operator_profiles").select("*").range(0, 4999),
          ]);

        if (opError || profError) {
          showMessage("message", (opError ?? profError).message);
          return;
        }

        const byOperatorId = new Map((profiles ?? []).map((p) => [p.operator_id, p]));
        rows = (operators ?? []).map((o) => ({
          ...o,
          companyProfile: byOperatorId.get(o.id) ?? null,
        }));
        rowsById = new Map(rows.map((r) => [r.id, r]));

        render();
      }

      function render() {
        const query = document.getElementById("search").value.trim().toLowerCase();
        let filtered = query
          ? rows.filter((r) =>
              [r.username, r.operator_name, r.companyProfile?.company_name]
                .filter(Boolean)
                .some((v) => v.toLowerCase().includes(query))
            )
          : rows;
        if (profileFilter === "missing") {
          filtered = filtered.filter((r) => !r.companyProfile);
        }
        filtered = [...filtered].sort((a, b) =>
          (a.operator_name || a.username).localeCompare(b.operator_name || b.username)
        );
        lastVisibleRows = filtered;

        const withProfile = rows.filter((r) => r.companyProfile).length;
        document.getElementById("summary-count").textContent =
          `${withProfile} of ${rows.length} operators have submitted a profile`;

        const host = document.getElementById("list");

        if (filtered.length === 0) {
          host.innerHTML = `<p class="empty">${
            rows.length === 0 ? "No operator accounts yet." : "No matches."
          }</p>`;
          return;
        }

        host.innerHTML = `
          <div class="card-grid">
            ${filtered
              .map((r) => {
                const p = r.companyProfile;
                const label = r.operator_name || r.username;
                return `
              <button type="button" class="record-card" data-open="${r.id}" title="${escapeHtml(label)}">
                <span class="record-card-avatar">${escapeHtml(initials(label))}</span>
                <span class="record-card-body">
                  <span class="record-card-title">${escapeHtml(label)}</span>
                  <span class="record-card-sub">${escapeHtml(p?.company_name || "@" + r.username)}</span>
                  <span class="record-card-meta">${
                    p
                      ? escapeHtml(p.trade_name || "Profile on file")
                      : `<span class="badge badge-pending">no profile yet</span>`
                  }</span>
                </span>
              </button>`;
              })
              .join("")}
          </div>
        `;

        host.querySelectorAll("[data-open]").forEach((card) => {
          card.addEventListener("click", () => openDetails(card.dataset.open));
        });
      }

      /* ----------------------------------------------- details dialog */

      function initDetailsDialog() {
        document
          .getElementById("details-close")
          .addEventListener("click", () => document.getElementById("details-dialog").close());
      }

      async function openDetails(operatorId) {
        const r = rowsById.get(operatorId);
        if (!r) return;
        const p = r.companyProfile;
        const label = r.operator_name || r.username;

        document.getElementById("details-title").textContent = label;
        document.getElementById("details-sub").textContent = `@${r.username}`;
        document.getElementById("details-body").innerHTML = !p
          ? `<div class="detail-item"><span class="detail-value">This operator hasn't submitted a company profile yet.</span></div>`
          : `
            <div class="detail-item"><span class="detail-label">Company</span><span class="detail-value">${escapeHtml(p.company_name || "—")}</span></div>
            <div class="detail-item"><span class="detail-label">Trade name</span><span class="detail-value">${escapeHtml(p.trade_name || "—")}</span></div>
            <div class="detail-item"><span class="detail-label">Operator/Trade code</span><span class="detail-value">${escapeHtml(p.operator_code || "—")}</span></div>
            <div class="detail-item"><span class="detail-label">Owner</span><span class="detail-value">${escapeHtml(p.company_owner || "—")}</span></div>
            <div class="detail-item"><span class="detail-label">Booking system</span><span class="detail-value">${
              p.has_booking_system ? escapeHtml(p.booking_system_name || "Yes") : "No"
            }</span></div>
            <div class="detail-item"><span class="detail-label">Logo</span><span class="detail-value" id="details-logo" data-logo-path="${escapeHtml(p.logo_path ?? "")}">${
              p.logo_path ? "&hellip;" : "—"
            }</span></div>
            <div class="detail-item detail-documents">
              <span class="detail-label">Contacts</span>
              <span class="detail-value">${
                (p.contacts ?? []).length
                  ? p.contacts.map((c) => escapeHtml(contactLine(c))).filter(Boolean).join("<br />")
                  : "—"
              }</span>
            </div>
          `;
        document.getElementById("details-dialog").showModal();

        if (p?.logo_path) {
          const { data } = await supabase.storage
            .from("operator-docs")
            .createSignedUrl(p.logo_path, 300);
          const cell = document.getElementById("details-logo");
          if (cell) {
            cell.innerHTML = data?.signedUrl
              ? `<a href="${data.signedUrl}" target="_blank" rel="noopener">View logo</a>`
              : "—";
          }
        }
      }
    </script>
  </body>
</html>
